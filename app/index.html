    if(p.valida_ate) h+=`<div class="maviso"><b>Prazo:</b> só faz sentido até ${hjDM(p.valida_ate)}.</div>`;
    if(p.avisos&&p.status==="aprovada_producao") h+=`<div class="maviso"><b>Aviso da produção:</b> ${hjE(p.avisos)}</div>`;
    if(p.status!=="descartado") h+=hjHoraBloco(p);
    if(["sugerida","ideia"].includes(p.status)){
      h+=`<label class="lbl" for="ajPre">Ajuste antes de produzir <span style="text-transform:none;letter-spacing:0;font-weight:500">(opcional)</span></label>
        <textarea class="campo" id="ajPre" rows="2" maxlength="1000" placeholder="Ex.: troca o exemplo por um de RH">${hjE(HJ.rascunho[p.id]||p.ajuste_pre||"")}</textarea>

      $("#ajCancela").onclick=()=>{ HJ.ajuste=false; hjAtualizarTela() };

    }
  }};
}

  if(!r) return;
  view.innerHTML=`<div class="wrap" style="max-width:720px">${aviso}${r.corpo}</div>`;
  $("#fabslot").innerHTML=r.barra?`<div class="hjbarra"><div class="in">${r.barra}</div></div>`:"";
  if(r.depois) r.depois();
  hjLigarRails();
}
function hjLigarRails(){
  ["estatico","reels"].forEach(f=>{ const r=document.getElementById("rail-"+f); if(!r) return;
    r.onscroll=()=>{ const c=r.querySelector(".card"); if(!c) return; const w=c.getBoundingClientRect().width+12, i=Math.min(r.children.length-1,Math.round(r.scrollLeft/w));
      document.querySelectorAll("#pt-"+f+" i").forEach((e,k)=>e.classList.toggle("on",k===i)) } });
}
/* re-render sem mexer na rolagem (depois de ações e cargas) */
function hjAtualizarTela(){
  const h=location.hash; if(!hjEhRota(h)) return;
  const sc={}; ["estatico","reels"].forEach(f=>{ const r=document.getElementById("rail-"+f); if(r) sc[f]=r.scrollLeft });
  hjRender();
  Object.keys(sc).forEach(f=>{ const r=document.getElementById("rail-"+f); if(r){ r.scrollLeft=sc[f]; if(r.onscroll) r.onscroll() } });
}
/* chamado por rota(): entra numa tela do módulo */
function hjEntrar(){
  const h=location.hash;
  if(!(h==="#/banco"||h.startsWith("#/pauta/"))&&HJ.alvo){ HJ.alvo=null; HJ.filtro.f="" }
  HJ.ajuste=false; HJ.hora=false;
  if(HJ.pronto&&!HJ.carregando&&!HJ.pend.size&&Date.now()-HJ.carregadoEm>30000) hjCarregar();
  hjRender();
}
/* imagem de slide que não carrega */
document.addEventListener("error",e=>{
  const im=e.target; if(!im||im.tagName!=="IMG"||!im.closest||!im.closest(".hj .sl")) return;
  const sl=im.closest(".sl"); sl.innerHTML=`<span class="sl-falhou">slide ${hjE(im.dataset.n||"")} não carregou</span>`;
},true);

function hjSairDaFicha(){
  if(!location.hash.startsWith("#/pauta/")) return;
  location.hash=["#/","#/banco","#/calendario","#/lixeira"].includes(HJ.de)?HJ.de:"#/";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-hj]"); if(!t) return;
  const a=t.dataset.hj, id=t.dataset.id, v=t.dataset.v;
  switch(a){
    case "produzir": hjProduzir(id); break;
    case "produzir-ficha": { const ta=$("#ajPre"), tinha=!!HJ.alvo; hjProduzir(id,ta?ta.value.trim():""); if(!tinha) hjSairDaFicha(); break }
    case "banco": hjParaBanco(id); hjSairDaFicha(); break;
    case "voltar-banco": hjVoltarBanco(id); hjSairDaFicha(); break;
    case "lixeira": hjParaLixeira(id); hjSairDaFicha(); break;
    case "restaurar": { const naFicha=location.hash.startsWith("#/pauta/"); hjRestaurar(id); if(naFicha) location.hash="#/banco"; break }
    case "aprovar": hjAprovar(id); break;
    case "postado": hjPostado(id); break;
    case "copiar-leg": { const p=hjGet(id); if(p) hjCopiar(p.legenda||"","legTx"); break }
    case "copiar-rot": { const p=hjGet(id); if(p) hjCopiar(hjRoteiroTxt(p),"reelsTx"); break }
    case "mudar-hora": HJ.hora=!HJ.hora; hjAtualizarTela(); break;
    case "hora": { const m=location.hash.match(/^#\/pauta\/(.+)$/); if(m) hjSetHora(decodeURIComponent(m[1]),v); break }
    case "salvar-hora": { const x=($("#horaIn")||{}).value, m=location.hash.match(/^#\/pauta\/(.+)$/); if(x&&m) hjSetHora(decodeURIComponent(m[1]),x); break }
    case "escolher": { const [dia,f]=v.split("|"); HJ.alvo={dia,formato:f}; HJ.filtro.f=f; location.hash="#/banco"; break }
    case "vista": HJ.cal.vista=v; hjAtualizarTela(); break;
    case "nav": { const n=Number(v), C=HJ.cal;
      if(C.vista==="semana") C.ini=addDias(C.ini,7*n);
      else { const [y,m]=C.mes.split("-").map(Number), x=new Date(Date.UTC(y,m-1+n,1)); C.mes=x.getUTCFullYear()+"-"+hjPad(x.getUTCMonth()+1) }
      hjAtualizarTela(); break }
    case "dia": HJ.cal.sel=v; hjAtualizarTela(); break;
    case "hoje-cal": HJ.cal=null; hjAtualizarTela(); break;
    case "ffmt": HJ.filtro.f=v; hjAtualizarTela(); break;
    case "ordem": HJ.filtro.ordem=v; hjAtualizarTela(); break;
    case "limpar": HJ.filtro.u=HJ.filtro.l=""; if(!HJ.alvo) HJ.filtro.f=""; hjAtualizarTela(); break;
    case "abrir": HJ.de=location.hash||"#/"; if(HJ.de==="#") HJ.de="#/"; location.hash="#/pauta/"+encodeURIComponent(id); break;
    case "ir": location.hash=v; break;
    case "tentar": HJ.erro=false; hjCarregar(); hjAtualizarTela(); break;
  }
});

/* ============ START ============ */
(async()=>{ await carregar(); await filaFlush(); rota(); })();
document.addEventListener("visibilitychange",()=>{ document.hidden ? flush() : filaFlush() });
window.addEventListener("pagehide",flush);
</script>
</body>
</html>
