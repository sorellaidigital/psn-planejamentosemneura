<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A16A8">
<title>Planejamento sem Neura</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234A16A8'/><circle cx='50' cy='50' r='27' fill='none' stroke='%23D7FF3E' stroke-width='11' stroke-dasharray='128 42' stroke-linecap='round' transform='rotate(-90 50 50)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- SUPERFÍCIES ---------------------------------------------------- */
  --superficie-territorio:#4A16A8;        /* roxo. navegação, header, diretório */
  --superficie-territorio-alta:#5C21C6;   /* camada elevada sobre roxo */
  --superficie-territorio-baixa:#3B0F87;  /* camada rebaixada / trilhas */
  --superficie-trabalho:#F2EFFA;          /* névoa. leitura e escrita longa */
  --superficie-cartao:#FFFFFF;
  --superficie-cartao-territorio:rgba(242,239,250,.10);
  --superficie-peso:#1C1225;              /* tinta. sheets, captura */
  --superficie-peso-alta:#2A1B38;

  /* ---- AÇÃO E SINAL ---------------------------------------------------- */
  --acao-ganho:#D7FF3E;                   /* ácido. só no que a pessoa ganha */
  --sobre-ganho:#1C1225;                  /* texto obrigatório sobre ácido */
  --selo-valor:#6E2639;                   /* bordô. selo, marco, conquista */
  --alerta:#FF2D55;                       /* preenchimento de badge apenas */
  --alerta-texto:#C4102F;                 /* variante AA para texto em névoa */

  /* ---- TEXTO ----------------------------------------------------------- */
  --texto-forte:#1C1225;
  --texto-medio:#4B4160;
  --texto-fraco:#6C6285;
  --texto-invertido:#F2EFFA;
  --texto-invertido-medio:rgba(242,239,250,.74);
  --texto-invertido-fraco:rgba(242,239,250,.56);

  /* ---- LINHAS ---------------------------------------------------------- */
  --linha:rgba(28,18,37,.13);
  --linha-forte:rgba(28,18,37,.24);
  --linha-territorio:rgba(242,239,250,.20);

  /* ---- TEMPERATURA (só onde a interface está medindo) ------------------ */
  --temp-0:#FF6B1F;    /* 0–39   laranja */
  --temp-40:#FF3D91;   /* 40–59  rosa */
  --temp-60:#9B5CFF;   /* 60–79  roxo (clareado p/ legibilidade no anel) */
  --temp-80:#D7FF3E;   /* 80–100 ácido */

  /* ---- TIPOGRAFIA ------------------------------------------------------ */
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-ui:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --f-selo:'Instrument Serif',Georgia,serif;
  --t-nano:11px; --t-micro:12px; --t-mini:13px; --t-base:15px;
  --t-md:17px;  --t-lg:21px;  --t-xl:27px; --t-2xl:34px; --t-num:46px;
  --tr-display:-.045em;   /* tracking de título: −4,5% */
  --tr-rotulo:.16em;      /* caixa alta espaçada */

  /* ---- ESPAÇO / RAIO / ALVO ------------------------------------------- */
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px; --e7:48px;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --alvo:44px;
  --sombra:0 10px 30px rgba(28,18,37,.18);
  --sombra-peso:0 -14px 40px rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--superficie-territorio);color:var(--texto-invertido);
  font:var(--t-base)/1.5 var(--f-ui);overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:var(--f-ui)}
a{color:var(--superficie-territorio);text-decoration:underline;text-underline-offset:3px}
a:hover{color:var(--selo-valor)}
.hide{display:none !important}
:focus-visible{outline:3px solid var(--acao-ganho);outline-offset:2px;border-radius:6px}
.clara :focus-visible{outline-color:var(--superficie-territorio)}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-thumb{background:var(--linha-forte);border-radius:9px}
::selection{background:var(--acao-ganho);color:var(--sobre-ganho)}

/* ===== primitivas ===================================================== */
.num{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  font-variant-numeric:tabular-nums;line-height:.9}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  line-height:1.02;text-transform:lowercase}
.rotulo{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase}
.romano{font-family:var(--f-selo);font-weight:400;letter-spacing:0}

/* anel de score — gesto emprestado do story ring, aqui vira medidor */
.anel{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from -90deg,var(--anel-cor) calc(var(--p) * 1%),var(--anel-trilha) 0)}
.anel>i{position:absolute;inset:var(--anel-esp,4px);border-radius:50%;
  background:var(--anel-miolo)}
.anel>span{position:relative;z-index:1}
.anel.vazio{background:var(--anel-trilha)}

/* botões */
.btn{min-height:var(--alvo);padding:0 var(--e4);border-radius:var(--r-pill);
  font-weight:700;font-size:var(--t-base);display:inline-flex;align-items:center;
  justify-content:center;gap:var(--e2);text-align:center;transition:transform .08s}
.btn:active{transform:scale(.975)}
.btn-ganho{background:var(--acao-ganho);color:var(--sobre-ganho)}
.btn-fantasma{background:transparent;border:1.5px solid var(--linha-forte);color:var(--texto-forte)}
.btn-fantasma-inv{background:var(--superficie-cartao-territorio);color:var(--texto-invertido);
  border:1.5px solid var(--linha-territorio)}
.btn-risco{background:transparent;border:1.5px solid rgba(196,16,47,.4);color:var(--alerta-texto)}
.icb{width:var(--alvo);height:var(--alvo);border-radius:var(--r-sm);display:grid;
  place-items:center;font-size:var(--t-md);flex:none;
  background:var(--superficie-cartao-territorio);color:var(--texto-invertido)}
.icb:active{background:rgba(242,239,250,.2)}
.icb-ganho{background:var(--acao-ganho);color:var(--sobre-ganho)}
.icb-clara{background:rgba(28,18,37,.07);color:var(--texto-forte)}

/* campos */
.campo{width:100%;background:var(--superficie-cartao);color:var(--texto-forte);
  border:1.5px solid var(--linha);border-radius:var(--r-md);padding:var(--e3) var(--e4);
  min-height:var(--alvo);resize:vertical;outline:none;font-size:var(--t-base);
  line-height:1.55;font-family:var(--f-ui)}
.campo::placeholder{color:var(--texto-fraco)}
.campo:focus{border-color:var(--superficie-territorio);
  box-shadow:0 0 0 3px rgba(74,22,168,.16)}
.campo-inv{background:rgba(242,239,250,.08);color:var(--texto-invertido);
  border-color:var(--linha-territorio)}
.campo-inv::placeholder{color:var(--texto-invertido-fraco)}
.campo-inv:focus{border-color:var(--acao-ganho);box-shadow:0 0 0 3px rgba(215,255,62,.22)}
.lbl{display:block;font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-medio);margin:var(--e5) 0 var(--e2)}
.sheetbody>.lbl:first-child{margin-top:0}
.dica{font-size:var(--t-micro);color:var(--texto-fraco);margin:calc(var(--e1) * -1) 0 var(--e2);
  line-height:1.45}

/* ===== HEADER (território) =========================================== */
header{position:sticky;top:0;z-index:30;background:var(--superficie-territorio);
  padding:calc(env(safe-area-inset-top) + 14px) var(--e4) 0}
.hrow{display:flex;align-items:center;gap:var(--e3);min-height:var(--alvo)}
.hrow .tt{flex:1;min-width:0}
.hrow .tt .n1{font-size:var(--t-md);font-weight:700;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tt .n2{font-size:var(--t-micro);color:var(--texto-invertido-medio);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca{display:flex;align-items:center;gap:var(--e3)}
.marca .selo{width:38px;height:38px;border-radius:11px;background:var(--acao-ganho);
  display:grid;place-items:center;flex:none}
.marca .selo svg{width:26px;height:26px}

/* placar do diretório: número primeiro */
.placar{display:flex;gap:var(--e5);padding:var(--e5) 0 var(--e4);align-items:flex-end}
.placar .it{display:flex;flex-direction:column;gap:2px}
.placar .v{font-size:var(--t-2xl)}
.placar .k{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-invertido-medio)}
.placar .it.ganho .v{color:var(--acao-ganho)}

/* busca */
.buscabox{position:relative;margin-bottom:var(--e4)}
.buscabox .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:var(--t-mini);color:var(--texto-invertido-fraco);pointer-events:none}
.buscabox .campo{padding-left:38px}

/* barra de stories: distribuição das ideias pelas 7 etapas */
.stories{display:flex;gap:var(--e1);padding:var(--e2) 0 0}
.stories span{flex:1;height:5px;border-radius:var(--r-pill);
  background:var(--superficie-territorio-baixa)}
.stories span.on{background:var(--acao-ganho)}
.stories span.meio{background:rgba(242,239,250,.42)}

/* abas de etapa */
.abas{display:flex;gap:var(--e2);overflow-x:auto;padding:var(--e4) 0 var(--e4);
  scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{white-space:nowrap;min-height:38px;padding:0 var(--e3);border-radius:var(--r-pill);
  background:var(--superficie-cartao-territorio);color:var(--texto-invertido-medio);
  font-size:var(--t-mini);font-weight:600;display:flex;gap:var(--e2);align-items:center;
  border:1.5px solid transparent}
.aba .n{background:rgba(242,239,250,.16);border-radius:var(--r-pill);
  padding:1px 7px;font-size:var(--t-nano);font-weight:700;font-variant-numeric:tabular-nums}
.aba.on{background:var(--acao-ganho);color:var(--sobre-ganho);font-weight:700}
.aba.on .n{background:rgba(28,18,37,.16)}
.aba .badge{background:var(--alerta);color:#fff;border-radius:var(--r-pill);
  min-width:20px;height:20px;display:grid;place-items:center;font-size:var(--t-micro);
  font-weight:700;padding:0 5px}

/* ===== ÁREA DE TRABALHO (névoa) ====================================== */
main{background:var(--superficie-trabalho);color:var(--texto-forte);
  min-height:calc(100vh - 120px);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--e5) var(--e4) 132px}
main.territorio{background:transparent;color:var(--texto-invertido);border-radius:0;
  padding-top:var(--e1)}
.wrap{max-width:1580px;margin:0 auto}
.secao-tit{display:flex;align-items:baseline;gap:var(--e3);margin:0 0 var(--e1)}
.secao-tit h2{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  font-size:var(--t-xl);margin:0;text-transform:lowercase;line-height:1.05}
.secao-tit .qt{font-size:var(--t-lg);color:var(--texto-fraco)}
.secao-sub{color:var(--texto-medio);font-size:var(--t-mini);margin:0 0 var(--e4);
  max-width:52ch;text-wrap:pretty}

/* pastas de canal */
.pastas{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:var(--e3)}
.pasta{background:var(--superficie-cartao-territorio);border:1.5px solid var(--linha-territorio);
  border-radius:var(--r-lg);padding:var(--e4);position:relative;text-align:left;width:100%;
  color:var(--texto-invertido);display:flex;flex-direction:column;gap:var(--e3);
  min-height:180px;cursor:pointer;transition:transform .1s,background .15s}
.pasta:hover{background:rgba(242,239,250,.16)}
.pasta:active{transform:scale(.985)}
.pasta .em{font-size:26px;line-height:1}
.pasta .nm{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  font-size:var(--t-md);line-height:1.1;word-break:break-word;text-transform:lowercase}
.pasta .hd{color:var(--texto-invertido-fraco);font-size:var(--t-micro);margin-top:2px}
.pasta .fim{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:var(--e2)}
.pasta .fim .v{font-size:var(--t-xl);color:var(--acao-ganho)}
.pasta .fim .k{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-invertido-medio);line-height:1.3}
.pasta .zap{position:absolute;top:var(--e2);right:var(--e2);width:var(--alvo);height:var(--alvo);
  border-radius:12px;display:grid;place-items:center;font-size:var(--t-md);
  background:rgba(28,18,37,.22);color:var(--texto-invertido)}
.pasta .zap:hover{background:var(--acao-ganho);color:var(--sobre-ganho)}
.pasta .sino{position:absolute;top:-6px;left:-6px;background:var(--alerta);color:#fff;
  border-radius:var(--r-pill);min-width:24px;height:24px;display:grid;place-items:center;
  font-size:var(--t-micro);font-weight:700;padding:0 6px;border:2px solid var(--superficie-territorio)}

/* card de ideia */
.card{background:var(--superficie-cartao);border:1.5px solid var(--linha);
  border-radius:var(--r-lg);padding:var(--e4);margin-bottom:var(--e3);width:100%;
  text-align:left;display:flex;gap:var(--e4);align-items:flex-start;color:var(--texto-forte);
  cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--linha-forte);box-shadow:0 4px 16px rgba(28,18,37,.07)}
.card .corpo{flex:1;min-width:0}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;
  font-size:var(--t-md);line-height:1.22;text-wrap:pretty}
.card .metas{display:flex;flex-wrap:wrap;gap:var(--e2);align-items:center;margin-top:var(--e3)}
.chip{font-size:var(--t-nano);font-weight:600;padding:4px 9px;border-radius:var(--r-pill);
  background:rgba(74,22,168,.09);color:var(--superficie-territorio);white-space:nowrap;
  max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.chip-neutro{background:rgba(28,18,37,.07);color:var(--texto-medio)}
.chip-selo{background:rgba(110,38,57,.11);color:var(--selo-valor)}
.card .avanca{width:var(--alvo);height:var(--alvo);border-radius:12px;flex:none;
  background:rgba(74,22,168,.09);color:var(--superficie-territorio);display:grid;
  place-items:center;font-size:var(--t-md);font-weight:700}
.card .avanca:hover{background:var(--acao-ganho);color:var(--sobre-ganho)}
.card .lado{display:flex;flex-direction:column;align-items:center;gap:var(--e2);flex:none}
.card[draggable=true]{cursor:grab}
.card.arrastando{opacity:.4}

/* estado vazio com propósito */
.vazio{background:var(--superficie-cartao);border:1.5px solid var(--linha);
  border-radius:var(--r-lg);padding:var(--e6) var(--e5);text-align:left;
  display:flex;flex-direction:column;gap:var(--e3);align-items:flex-start}
.vazio .n{font-size:var(--t-2xl);color:var(--linha-forte)}
.vazio h4{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  font-size:var(--t-lg);margin:0;text-transform:lowercase}
.vazio p{margin:0;color:var(--texto-medio);font-size:var(--t-mini);max-width:44ch;text-wrap:pretty}
.vazio.inv{background:var(--superficie-cartao-territorio);border-color:var(--linha-territorio);
  color:var(--texto-invertido)}
.vazio.inv .n{color:rgba(242,239,250,.28)}
.vazio.inv p{color:var(--texto-invertido-medio)}

/* filtros */
.filtros{display:flex;gap:var(--e2);flex-wrap:wrap;margin-bottom:var(--e4)}
.filtro{min-height:36px;padding:0 var(--e3);border-radius:var(--r-pill);font-size:var(--t-micro);
  font-weight:600;background:rgba(28,18,37,.06);color:var(--texto-medio);
  border:1.5px solid transparent}
.filtro.on{background:var(--superficie-territorio);color:var(--texto-invertido);font-weight:700}

/* kanban desktop */
.kanban{display:flex;gap:var(--e3);overflow-x:auto;padding-bottom:var(--e4);align-items:flex-start}
.col{flex:0 0 282px;background:rgba(28,18,37,.045);border:1.5px solid var(--linha);
  border-radius:var(--r-lg);padding:var(--e3);transition:background .12s,border-color .12s}
.col.alvo{background:rgba(215,255,62,.28);border-color:var(--superficie-territorio)}
.col .ch{display:flex;align-items:center;gap:var(--e2);margin-bottom:var(--e1)}
.col .ch .t{font-size:var(--t-micro);font-weight:700;letter-spacing:.02em;flex:1;line-height:1.25}
.col .ch .q{font-size:var(--t-md);color:var(--texto-fraco)}
.col .cd{color:var(--texto-fraco);font-size:var(--t-nano);margin:0 0 var(--e3);line-height:1.4;
  min-height:2.8em}
.col .card{padding:var(--e3);border-radius:var(--r-md);gap:var(--e3)}
.col .card h3{font-size:var(--t-base)}
.col .add{width:100%;min-height:var(--alvo);border-radius:var(--r-md);
  border:1.5px dashed var(--linha-forte);color:var(--texto-medio);font-size:var(--t-micro);
  font-weight:600}
.col .add:hover{border-color:var(--superficie-territorio);color:var(--superficie-territorio)}

/* ===== FABs ========================================================== */
.fabs{position:fixed;left:var(--e4);right:var(--e4);
  bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:40;display:flex;gap:var(--e2)}
.fabs .btn{flex:1;min-height:54px;box-shadow:var(--sombra);font-size:var(--t-md)}
.fabs .btn-sec{flex:0 0 42%;background:var(--superficie-peso);color:var(--texto-invertido);
  border:none}

/* ===== SHEETS ======================================================== */
.sheet{position:fixed;inset:0;z-index:50;background:var(--superficie-trabalho);
  color:var(--texto-forte);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
.sheethead{position:sticky;top:0;z-index:5;background:var(--superficie-territorio);
  color:var(--texto-invertido);padding:calc(env(safe-area-inset-top) + 12px) var(--e4) var(--e3)}
.sheetbody{padding:var(--e5) var(--e4) var(--e7);max-width:860px;margin:0 auto}
@media(min-width:900px){.sheetbody{max-width:920px}}

/* stepper de etapa (barra de stories que também move) */
.stepper{padding:var(--e4) 0 0}
.stepper .trilha{display:flex;gap:var(--e1)}
.stepper .trilha button{flex:1;height:var(--e2);border-radius:var(--r-pill);
  background:var(--superficie-territorio-baixa);position:relative}
.stepper .trilha button::after{content:'';position:absolute;inset:-14px -2px;}
.stepper .trilha button.feito{background:rgba(242,239,250,.5)}
.stepper .trilha button.on{background:var(--acao-ganho)}
.stepper .leg{display:flex;justify-content:space-between;align-items:center;
  margin-top:var(--e3);gap:var(--e3)}
.stepper .leg .at{font-size:var(--t-mini);font-weight:700;color:var(--acao-ganho)}
.stepper .leg .prox{min-height:36px;padding:0 var(--e3);border-radius:var(--r-pill);
  background:var(--acao-ganho);color:var(--sobre-ganho);font-size:var(--t-micro);font-weight:700}

/* topo da ficha: número herói */
.fichatopo{display:flex;gap:var(--e4);align-items:center;
  background:var(--superficie-cartao);border:1.5px solid var(--linha);
  border-radius:var(--r-lg);padding:var(--e4);margin-bottom:var(--e5)}
.fichatopo .txt{flex:1;min-width:0}
.fichatopo .rot{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-fraco)}
.fichatopo .frase{font-size:var(--t-mini);color:var(--texto-medio);margin-top:var(--e1);
  line-height:1.45;text-wrap:pretty}

/* acordeão de checklist */
.grupo-tit{display:flex;align-items:center;gap:var(--e3);margin:var(--e6) 0 var(--e3)}
.grupo-tit .t{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-medio)}
.grupo-tit .l{flex:1;height:1.5px;background:var(--linha)}
.grupo-tit .agora{background:var(--acao-ganho);color:var(--sobre-ganho);border-radius:var(--r-pill);
  padding:3px 9px;font-size:var(--t-nano);font-weight:700;letter-spacing:.06em}
.acc{border:1.5px solid var(--linha);border-radius:var(--r-md);margin-bottom:var(--e2);
  overflow:hidden;background:var(--superficie-cartao)}
.acc.aberta{border-color:var(--linha-forte)}
.acchead{width:100%;display:flex;align-items:center;gap:var(--e3);padding:var(--e3);
  text-align:left;min-height:var(--alvo)}
.acchead .nm{flex:1;font-size:var(--t-mini);font-weight:700;line-height:1.3}
.acchead .ct{font-size:var(--t-micro);font-weight:700;color:var(--texto-fraco);
  font-variant-numeric:tabular-nums}
.acchead .ct.cheio{color:var(--selo-valor)}
.accbody{padding:0 var(--e3) var(--e2)}
.item{display:flex;gap:var(--e3);align-items:flex-start;padding:var(--e2) 0;
  border-top:1.5px solid var(--linha);min-height:var(--alvo)}
.item input{margin:3px 0 0;width:22px;height:22px;accent-color:var(--superficie-territorio);flex:none}
.item label{font-size:var(--t-mini);line-height:1.45;flex:1;padding:var(--e1) 0;cursor:pointer}
.item.done label{color:var(--texto-fraco);text-decoration:line-through}
.item b{font-weight:700;color:var(--texto-forte)}
.item.done b{color:var(--texto-fraco)}

.linhabtn{display:flex;gap:var(--e2);margin-top:var(--e6)}
.linhabtn .btn{flex:1}
.linkout{display:inline-flex;align-items:center;gap:6px;margin-top:var(--e4);
  font-size:var(--t-micro);font-weight:600;color:var(--superficie-territorio)}

/* captura rápida (tinta — foco total, zero decoração) */
.qc{position:fixed;inset:0;z-index:60;background:rgba(28,18,37,.72);display:flex;
  align-items:flex-end;backdrop-filter:blur(2px)}
.qcbox{background:var(--superficie-peso);color:var(--texto-invertido);
  border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:660px;margin:0 auto;
  padding:var(--e5) var(--e4) calc(env(safe-area-inset-bottom) + 20px);box-shadow:var(--sombra-peso)}
.qcbox .rot{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--acao-ganho)}
.qcbox h4{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  font-size:var(--t-xl);margin:var(--e2) 0 var(--e1);text-transform:lowercase}
.qcbox p{margin:0 0 var(--e4);color:var(--texto-invertido-medio);font-size:var(--t-mini)}
.qcbox textarea{min-height:120px;font-size:var(--t-md)}
.qcbox .pe{display:flex;gap:var(--e2);margin-top:var(--e4);align-items:center}
.qcbox .pe .btn{flex:1;min-height:52px}
.qcbox .dicatecla{font-size:var(--t-nano);color:var(--texto-invertido-fraco);
  margin-top:var(--e3);text-align:center}

/* menu de ações */
.menu{position:fixed;inset:0;z-index:60;background:rgba(28,18,37,.72);display:flex;
  align-items:flex-end}
.menubox{background:var(--superficie-cartao);color:var(--texto-forte);width:100%;
  max-width:520px;margin:0 auto var(--e2);border-radius:var(--r-xl);overflow:hidden;
  padding:var(--e2)}
.menubox button{width:100%;min-height:52px;text-align:left;padding:0 var(--e4);
  border-radius:var(--r-md);font-size:var(--t-base);font-weight:600;
  display:flex;align-items:center;gap:var(--e3)}
.menubox button:hover{background:rgba(28,18,37,.05)}
.menubox button.risco{color:var(--alerta-texto)}
.menubox .sep{height:1.5px;background:var(--linha);margin:var(--e2) var(--e4)}

/* seletor de emoji */
.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--alvo),1fr));gap:var(--e2)}
.emgrid button{aspect-ratio:1;min-height:var(--alvo);border-radius:var(--r-md);font-size:22px;
  background:var(--superficie-cartao);border:1.5px solid var(--linha);display:grid;place-items:center}
.emgrid button.on{border-color:var(--superficie-territorio);background:rgba(74,22,168,.1);
  box-shadow:0 0 0 2px rgba(74,22,168,.3)}

/* toast — ancorado no topo, nunca sobre o botão do sheet */
.toast{position:fixed;left:50%;transform:translate(-50%,-16px);
  top:calc(env(safe-area-inset-top) + 12px);z-index:99;
  background:var(--superficie-peso);color:var(--texto-invertido);font-weight:700;
  font-size:var(--t-mini);padding:var(--e3) var(--e4);border-radius:var(--r-pill);
  opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:88vw;
  text-align:center;box-shadow:var(--sombra);display:flex;align-items:center;gap:var(--e2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .pt{width:8px;height:8px;border-radius:50%;background:var(--acao-ganho);flex:none}
.toast.err .pt{background:var(--alerta)}
.carregando{padding:var(--e7) 0;text-align:center;color:var(--texto-invertido-medio);
  font-size:var(--t-mini)}

/* segmentado: reels|estático, ideias|produção */
.seg{display:flex;background:rgba(28,18,37,.06);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:var(--r-pill);font-size:var(--t-mini);
  font-weight:700;color:var(--texto-medio)}
.seg button.on{background:var(--superficie-territorio);color:var(--texto-invertido)}

/* seções do diretório (ideias / produção) */
.secao-dir{margin-bottom:var(--e6)}
.secao-dir:last-child{margin-bottom:0}

/* chips extras de status do mecanismo */
.chip-erro{background:rgba(196,16,47,.10);color:var(--alerta-texto)}
.chip-proc{background:rgba(155,92,255,.16);color:#5C21C6}

/* clamp de 2 linhas (por que chamou atenção) */
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* tira de slides da referência analisada */
.slides{display:flex;gap:var(--e3);overflow-x:auto;padding:var(--e2) 0 var(--e3);
  scroll-snap-type:x mandatory}
.slide{flex:0 0 220px;scroll-snap-align:start;background:var(--superficie-cartao);
  border:1.5px solid var(--linha);border-radius:var(--r-md);padding:var(--e3);
  display:flex;flex-direction:column;gap:var(--e2)}
.slide img{width:100%;border-radius:var(--r-sm);aspect-ratio:9/16;object-fit:cover;
  background:rgba(28,18,37,.06)}
.slide .sn{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-fraco)}
.slide .stx{font-size:var(--t-mini);white-space:pre-wrap;line-height:1.4}
.slide .svi{font-size:var(--t-micro);color:var(--texto-fraco);font-style:italic}

/* destaque de ganho — "o que reaproveitar" */
.destaque{background:rgba(215,255,62,.22);border:1.5px solid rgba(215,255,62,.55);
  border-radius:var(--r-md);padding:var(--e4);margin:var(--e3) 0}
.destaque .t{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--selo-valor);margin-bottom:var(--e1)}

/* sequência de estrutura em chips */
.seq{display:flex;flex-wrap:wrap;gap:var(--e1);align-items:center}
.seq .sep{color:var(--texto-fraco)}

/* rótulos claros dentro da captura rápida (fundo escuro) */
.qcbox .lbl{color:var(--texto-invertido-fraco)}

/* marcações de foco (chips multi-seleção) na captura escura */
.qcbox .filtros{margin-bottom:0}
.qcbox .filtro{background:rgba(242,239,250,.08);color:var(--texto-invertido-medio);
  border-color:var(--linha-territorio);min-height:40px}
.qcbox .filtro.on{background:var(--acao-ganho);color:var(--sobre-ganho);border-color:transparent}
.serie-wrap{margin-top:var(--e3)}
.filtro.sub{min-height:32px}
.chip-serie{background:rgba(28,18,37,.05);color:var(--texto-medio);border:1px dashed var(--linha-forte)}
.destaque ol{margin:var(--e2) 0 0;padding-left:1.4em}
.destaque ol li{margin-bottom:var(--e1)}
.destaque ul{margin:var(--e2) 0 0;padding-left:1.2em}

@media(min-width:900px){
  header{padding-left:var(--e6);padding-right:var(--e6)}
  main{padding:var(--e6) var(--e6) 120px}
  .pastas{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--e4)}
  .fabs{left:auto;right:var(--e6);width:auto}
  .fabs .btn,.fabs .btn-sec{flex:0 0 auto;padding:0 var(--e5)}
  .placar{gap:var(--e7)}
  .placar .v{font-size:var(--t-num)}
  .sheethead{padding-left:var(--e6);padding-right:var(--e6)}
}
/* ===== MÉTRICAS ======================================================= */
:root{--ok-texto:#17683A;--serie-a:#4A16A8;--serie-b:#C25E00}
.metricas-entrada{width:100%;display:flex;align-items:center;gap:var(--e4);text-align:left;
  background:var(--acao-ganho);color:var(--sobre-ganho);border-radius:var(--r-lg);
  padding:var(--e4);margin:0 0 var(--e6);min-height:72px;transition:transform .1s}
.metricas-entrada:active{transform:scale(.985)}
.metricas-entrada .em{font-size:28px;line-height:1}
.metricas-entrada .nm{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  font-size:var(--t-lg);line-height:1.05;text-transform:lowercase}
.metricas-entrada .hd{font-size:var(--t-micro);opacity:.8;margin-top:2px}
.metricas-entrada .go{margin-left:auto;font-size:var(--t-lg);font-weight:700}
.mperiodo{display:flex;flex-wrap:wrap;gap:var(--e2);margin-bottom:var(--e3)}
.mcustom{display:flex;flex-wrap:wrap;gap:var(--e3);align-items:flex-end;margin-bottom:var(--e3)}
.mcustom label{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-medio);display:flex;flex-direction:column;gap:var(--e1)}
.mcustom .campo{width:auto;min-width:150px}
.mcomp{font-size:var(--t-micro);color:var(--texto-fraco);margin:0 0 var(--e5)}
.msaude{font-size:var(--t-micro);color:var(--texto-medio);margin:0 0 var(--e4);display:flex;gap:var(--e2);align-items:center}
.msaude i{width:8px;height:8px;border-radius:50%;background:var(--ok-texto);flex:none}
.msaude.aviso i{background:var(--selo-valor)}
.maviso{background:rgba(110,38,57,.08);border:1.5px solid rgba(110,38,57,.28);color:var(--texto-forte);
  border-radius:var(--r-md);padding:var(--e3) var(--e4);margin:0 0 var(--e4);font-size:var(--t-mini);line-height:1.45}
.maviso b{color:var(--selo-valor)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e3);margin-bottom:var(--e6)}
.kpi{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);
  padding:var(--e4);display:flex;flex-direction:column;gap:var(--e2);min-width:0}
.kpi .k{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;
  color:var(--texto-medio);line-height:1.3}
.kpi .v{font-size:var(--t-xl);line-height:1}
.kpi .d{font-size:var(--t-micro);font-weight:700;color:var(--texto-fraco);font-variant-numeric:tabular-nums}
.kpi .d.up{color:var(--ok-texto)} .kpi .d.down{color:var(--alerta-texto)}
.kpi .s{font-size:var(--t-nano);color:var(--texto-fraco);line-height:1.35}
.mcard{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);
  padding:var(--e4);margin-bottom:var(--e4)}
.mcard h3{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);
  font-size:var(--t-md);margin:0 0 var(--e3);text-transform:lowercase}
.mleg{display:flex;flex-wrap:wrap;gap:var(--e4);margin:0 0 var(--e3);font-size:var(--t-micro);color:var(--texto-medio)}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:12px;height:3px;border-radius:2px;display:inline-block}
.mchart{position:relative;width:100%;touch-action:pan-y}
.mchart svg{display:block;width:100%;height:auto;overflow:visible}
.mchart text{font-family:var(--f-ui);font-size:11px;fill:var(--texto-fraco)}
.mtip{position:absolute;top:0;pointer-events:none;background:var(--superficie-peso);color:var(--texto-invertido);
  border-radius:var(--r-sm);padding:var(--e2) var(--e3);font-size:var(--t-micro);line-height:1.45;
  white-space:nowrap;box-shadow:var(--sombra);z-index:3;opacity:0;transition:opacity .08s}
.mtip.on{opacity:1}
.mtip b{display:block;margin-bottom:2px}
.mtip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.msemdados{padding:var(--e6) 0;text-align:center;color:var(--texto-fraco);font-size:var(--t-mini)}
.manalise p{margin:0 0 var(--e2);font-size:var(--t-mini);color:var(--texto-medio);white-space:pre-wrap;line-height:1.5}
.manalise .dt{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-fraco);margin-bottom:var(--e2)}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* ===== HOJE · CALENDÁRIO · BANCO · LIXEIRA · FICHA (escopo .hj) ======================== */

/* tokens do módulo (derivados do protótipo; só tema claro) */
:root{--chip-bg:rgba(74,22,168,.09);--chip-tx:#4A16A8;--chip-neutro-bg:rgba(28,18,37,.07);--chip-selo-bg:rgba(110,38,57,.11);
  --chip-erro-bg:rgba(196,16,47,.10);--sutil:rgba(28,18,37,.06);--aviso-bg:rgba(110,38,57,.08);--aviso-borda:rgba(110,38,57,.28);
  --ganho-suave:rgba(215,255,62,.22);--ganho-borda:rgba(215,255,62,.55);--foco:#4A16A8}
/* ajustes sobre as primitivas do app, só dentro do módulo */
.hj .card{display:block;align-items:normal;gap:0;width:auto;cursor:auto}
.hj .card:hover{border-color:var(--linha);box-shadow:none}
.hj .card .metas{margin-top:0}
.hj .dica{margin:var(--e1) 0 var(--e2)}
.hj .btn-mini{min-height:36px;padding:0 var(--e3);font-size:var(--t-micro);border-radius:var(--r-pill);font-weight:700;background:var(--sutil);color:var(--texto-forte);display:inline-flex;align-items:center;gap:6px}
.hj .btn-lix{flex:0 0 auto;width:var(--alvo);height:var(--alvo);display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:50%;color:var(--alerta-texto);cursor:pointer}
.hj .btn-lix:hover{background:rgba(196,16,47,.08)}
.hj .btn-lix:focus-visible{outline:2px solid var(--alerta-texto);outline-offset:2px}
.hj .hrow2{display:flex;align-items:center;gap:var(--e2);padding:6px 0;border-top:1px solid var(--linha);font-size:var(--t-mini)}
.hj .hrow2:first-of-type{border-top:none}
.hj .hrow2 b{width:34px;flex:none;text-transform:uppercase;font-size:var(--t-nano);letter-spacing:var(--tr-rotulo);color:var(--texto-medio)}
.hj .hrow2.hj b{color:var(--texto-forte)}
.hj .sl{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--sutil)}
.hj .sl img{display:block;width:100%;height:100%;object-fit:cover}
.hj .sl-falhou{position:absolute;inset:0;display:grid;place-items:center;padding:var(--e2);text-align:center;font-size:var(--t-micro);color:var(--texto-fraco)}
.hj .thumbs .sl-falhou{font-size:var(--t-nano)}
.hj .semdesc{margin-top:var(--e3)}
.hj .pill,.hj .hoje-linha,.hj .placar .it{font-family:var(--f-ui)}
.hj{overflow-x:clip}
/* barra fixa de ação da ficha (vive no #fabslot, fora do #view) */
.hjbarra{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--superficie-trabalho);border-top:1.5px solid var(--linha);
  padding:var(--e3) var(--e4) calc(env(safe-area-inset-bottom) + 12px)}
.hjbarra .in{max-width:720px;margin:0 auto;display:flex;gap:var(--e2)}
.hjbarra .btn{flex:1;min-height:52px;font-size:var(--t-md)}
.hjbarra .btn-ganho{flex:1.5}
.hjbarra .btn[disabled]{opacity:.45;pointer-events:none}
/* toast com Desfazer */
.toast.comdes{padding:var(--e2) var(--e2) var(--e2) var(--e4);pointer-events:auto}
.toast #toastBtn{min-height:36px;padding:0 var(--e3);border-radius:var(--r-pill);background:rgba(242,239,250,.14);color:var(--acao-ganho);font-weight:700;font-size:var(--t-micro);flex:none}
.toast .tx,.toast #toastTxt{padding:4px 0}
.hj .btn[disabled]{opacity:.45;pointer-events:none}
.hj select.campo{min-height:40px;padding:0 var(--e3);font-size:var(--t-mini);font-weight:600}
.hj .placar{display:flex;gap:var(--e5);padding:var(--e4) 0 var(--e4);align-items:flex-end;flex-wrap:wrap}
.hj .placar .it{display:flex;flex-direction:column;gap:2px;text-align:left;color:inherit}
.hj .placar .v{font-size:var(--t-2xl)}
.hj .placar .v small{font-size:var(--t-md);color:var(--texto-invertido-fraco);letter-spacing:0}
.hj .placar .k{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-invertido-medio);line-height:1.3}
.hj .hdia{font-family:var(--f-ui);font-weight:600;font-size:var(--t-md);color:var(--texto-invertido);line-height:1.2;margin-top:var(--e3)}
.hj .hdia i{color:var(--acao-ganho);font-style:normal}
.hj .secao-tit{display:flex;align-items:baseline;gap:var(--e3);margin:var(--e6) 0 var(--e1)}
.hj .secao-tit:first-child{margin-top:0}
.hj .secao-tit h2{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);font-size:var(--t-xl);margin:0;text-transform:lowercase;line-height:1.05}
.hj .secao-tit .qt{font-size:var(--t-lg);color:var(--texto-fraco)}
.hj .chip{font-size:var(--t-nano);font-weight:600;padding:4px 9px;border-radius:var(--r-pill);background:var(--chip-bg);color:var(--chip-tx);
  white-space:nowrap;max-width:24ch;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.hj .chip-neutro{background:var(--chip-neutro-bg);color:var(--texto-medio)}
.hj .chip-selo{background:var(--chip-selo-bg);color:var(--selo-valor)}
.hj .chip-erro{background:var(--chip-erro-bg);color:var(--alerta-texto)}
.hj .chip-ganho{background:var(--acao-ganho);color:var(--sobre-ganho);font-weight:700}
.hj .chip-ex{background:transparent;border:1px dashed var(--linha-forte);color:var(--texto-fraco);font-weight:600}
.hj .metas{display:flex;flex-wrap:wrap;gap:var(--e2);align-items:center}
.hj .card{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);padding:var(--e4);margin-bottom:var(--e3);
  color:var(--texto-forte);position:relative}
.hj .card h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:var(--t-md);line-height:1.22;text-wrap:pretty}
.hj .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hj .abre{display:block;width:100%;text-align:left;color:inherit;padding:0}
.hj .acoes{display:flex;gap:var(--e2);margin-top:var(--e4);align-items:center}
.hj .acoes .btn{flex:1}

async function filaFlush(){

  for(const o of f){ try{ await db("psn_ideias",{method:"POST",body:JSON.stringify(o)}) }catch(e){ restam.push(o) } }

}

/* extrai a primeira URL http(s) de um texto (link + texto colado junto) */
function extrairUrl(s){
  if(!s) return null;
  const m=String(s).match(/https?:\/\/\S+/i);
  return m ? m[0].replace(/[)\]\.,"']+$/,"") : null;
}

function pastaHTML(c){

    const pend = meus.filter(i=>["pendente","processando","erro"].includes(i.mec_status)).length;

    return `<div class="pasta" data-go="${c.id}" tabindex="0" role="button">
      ${pend?`<span class="sino" title="${pend} pendente(s) no mecanismo">${pend}</span>`:""}

        <span class="v num">${proc}</span>
        <span class="k">processadas<br>de ${meus.length}</span>
      </div>

    </div>
    <div class="fim">
      <span class="v num">${prontas}</span>
      <span class="k">prontas<br>de ${meus.length}</span>
    </div>
  </div>`;
}

/* ---------- rótulos e chips do mecanismo (canais de ideias) ---------- */
const MEC_LABEL = {pendente:"Pendente",processando:"Processando",processada:"Processada",erro:"Erro",descartada:"Descartada"};
function mecChip(i){
  const st=i.mec_status;
  if(!st) return `<span class="chip chip-neutro">sem link</span>`;
  const cls = st==="processada"?"chip-selo":st==="erro"?"chip-erro":st==="processando"?"chip-proc":"chip";
  const title = st==="erro" && i.mec_erro ? ` title="${esc(i.mec_erro)}"` : "";
  return `<span class="chip ${cls}"${title}>${MEC_LABEL[st]||st}</span>`;
}
function plataformaLabel(p){
  return p==="instagram"?"📷 IG":p==="tiktok"?"🎵 TikTok":p?"🔗 Link":"";
}

  if(!["pendentes","processadas","descartadas","todas"].includes(filtro)) filtro="pendentes";

    ${chips.map(([k,n,q])=>`<button class="filtro ${filtro===k?"on":""}" data-f="${k}">${n} ${q?"· "+q:""}</button>`).join("")}
    ${semLink?`<span class="chip chip-neutro">🔗 ${semLink} sem link</span>`:""}
  </div>`;
  let fextra="";

/* temas da pasta de utilidade: uma consulta em lote por canal (só ideias já processadas) */
async function garantirTemas(c,meus){
  if(temasTentado[c.id]) return;
  const ids=meus.filter(i=>i.mec_status==="processada" && !(i.id in temaPorIdeia)).map(i=>i.id);
  if(!ids.length) return;
  temasTentado[c.id]=true;
  try{
    for(let k=0;k<ids.length;k+=40){
      const lote=ids.slice(k,k+40);
      const rows=await db("psn_referencias?select=ideia_id,aprendizado,tags&ideia_id=in.("+lote.join(",")+")");
      lote.forEach(id=>{ temaPorIdeia[id]="" });
      (rows||[]).forEach(r=>{ temaPorIdeia[r.ideia_id]=String((r.aprendizado&&r.aprendizado.tema)||(r.tags||[])[0]||"").trim().toLowerCase() });
    }
  }catch(e){ console.error(e); return }
  if(atual && atual.id===c.id) renderPainelIdeias();
}

/* drag & drop desktop: move etapa sem abrir a ficha */
function ligarDnD(){
  let arrasto=null;
  $("#view").querySelectorAll("[data-drag]").forEach(el=>{
    el.ondragstart=e=>{ arrasto=el.dataset.drag; el.classList.add("arrastando");
      e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",arrasto) };
    el.ondragend=()=>{ el.classList.remove("arrastando");
      $("#view").querySelectorAll(".col").forEach(c=>c.classList.remove("alvo")) };
  });
  $("#view").querySelectorAll("[data-col]").forEach(col=>{
    col.ondragover=e=>{ e.preventDefault(); col.classList.add("alvo") };
    col.ondragleave=()=>col.classList.remove("alvo");
    col.ondrop=e=>{ e.preventDefault(); col.classList.remove("alvo");
      const id=arrasto||e.dataTransfer.getData("text/plain");
      moverPara(id,col.dataset.col) };
  });
}
async function moverPara(id,st){
  const i=ideias.find(x=>x.id===id); if(!i||i.stage===st) return;
  i.stage=st; render();
  try{ await db("psn_ideias?id=eq."+id,{method:"PATCH",body:JSON.stringify({stage:st})});
    toast("→ "+STAGES.find(s=>s.id===st).curto);
  }catch(e){ toast("Não consegui mover",1) }
}
function avancar(id){
  const i=ideias.find(x=>x.id===id); if(!i) return;
  const k=STAGES.findIndex(s=>s.id===i.stage);
  if(k<STAGES.length-1) moverPara(id,STAGES[k+1].id);
}

async function salvarCanal(){
  const nome=$("#cNome").value.trim();
  if(!nome){ toast("Falta o nome do canal",1); $("#cNome").focus(); return }
  const handle=$("#cHandle").value.trim();
  const nicho=$("#cNicho").value.trim();
  const patch={nome, handle, emoji:emojiSel, nicho, tipo_conteudo:tipoSel};
  if(!canalEdit) patch.finalidade=finalidadeSel;
  try{
    if(canalEdit){
      const [u]=await db("psn_criadores?id=eq."+canalEdit.id,{method:"PATCH",body:JSON.stringify(patch)});

      const k=criadores.findIndex(x=>x.id===canalEdit.id); if(k>-1) criadores[k]=canalEdit;

        body:JSON.stringify({...patch, ordem:criadores.length})});

let qcAlvo=null, qcStage="tempestade", qcExterno=false, qcFoco=[];
/* ajusta rótulo/placeholder e o bloco de marcações conforme o tipo do canal escolhido */
function pintarQCCanal(canalId){
  const c=criadores.find(x=>x.id===canalId);
  const util=isUtil(c), post=isIdeiaPost(c);
  $("#qcTxtLbl").textContent = util ? "O que quer aprender/usar disso" : "Ideia";
  $("#qcTxt").placeholder = util ? "ex: lista de ganchos pra testar nos meus carrosséis"
    : c?.finalidade==="ideias" ? "o que chamou sua atenção e como isso entra no seu conteúdo"
    : "ex: o erro que todo mundo comete ao cortar o primeiro segundo do vídeo";
  $("#qcFocoWrap").classList.toggle("hide",!post);
  pintarQCFoco();
}
function pintarQCFoco(){
  $("#qcFocoRow").innerHTML=FOCOS.map(([k,n])=>
    `<button type="button" class="filtro ${qcFoco.includes(k)?"on":""}" data-k="${k}" aria-pressed="${qcFoco.includes(k)}">${n}</button>`).join("");
  $("#qcFocoRow").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    qcFoco = qcFoco.includes(k) ? qcFoco.filter(x=>x!==k) : [...qcFoco,k];
    pintarQCFoco();

  });

function resetQCFoco(){ qcFoco=[]; $("#qcSerie").value=""; pintarSeries() }
function abrirQC(criadorId, st){
  qcExterno=false;
  qcAlvo=criadorId; qcStage=st||"tempestade";
  const c=criadores.find(x=>x.id===criadorId);
  $("#qcRot").textContent = "Tempestade de ideias";
  $("#qcH4").textContent = "joga aqui antes de esquecer";
  $("#qcSub").textContent = "Em "+(c?.nome||"canal")+" · lapida depois. Sem internet, guarda no aparelho e sobe sozinha.";
  $("#qcCanalWrap").classList.add("hide");
  resetQCFoco(); pintarQCCanal(criadorId);
  $("#qcTxt").value=""; $("#qcRef").value="";
  $("#qc").classList.remove("hide");
  document.body.style.overflow="hidden";
  setTimeout(()=>$("#qcTxt").focus(),90);
}
/* captura vinda de fora (atalho do iPhone): #/capturar?ref=<link> */
function abrirQCExterno(url){
  const ideiasCanais = criadores.filter(c=>c.finalidade==="ideias");
  if(!ideiasCanais.length){
    if(!bancoOk){ toast("Sem conexão agora. Compartilhe de novo em instantes.",1); return; }
    toast("Crie um canal de Ideias pra guardar esse link",1);
    setTimeout(()=>formCanal(null,"ideias"),250);
    return;
  }
  const baixo=(url||"").toLowerCase();
  const sugestaoTipo = /tiktok\.com|\/reel\//.test(baixo) ? "reels"
    : /instagram\.com\/p\//.test(baixo) ? "estatico" : null;
  /* nunca sugere utilidade: essa escolha é da pessoa */
  const sugerido = (sugestaoTipo && ideiasCanais.find(c=>c.tipo_conteudo===sugestaoTipo))
    || ideiasCanais.find(c=>!isUtil(c)) || ideiasCanais[0];

  qcExterno=true; qcAlvo=sugerido.id; qcStage="tempestade";
  $("#qcRot").textContent="Tempestade de ideias";
  $("#qcH4").textContent="joga aqui antes de esquecer";
  $("#qcSub").textContent="Confira o canal e o link antes de salvar.";
  $("#qcCanalWrap").classList.remove("hide");
  $("#qcCanalSel").innerHTML = ideiasCanais.map(c=>
    `<option value="${c.id}" ${c.id===sugerido.id?"selected":""}>${esc(c.emoji||"💡")} ${esc(c.nome)}</option>`).join("");
  resetQCFoco(); pintarQCCanal(sugerido.id);
  $("#qcTxt").value=""; $("#qcRef").value=url||"";
  $("#qc").classList.remove("hide");
  document.body.style.overflow="hidden";
  setTimeout(()=>$("#qcTxt").focus(),90);
}
function fecharQC(){ $("#qc").classList.add("hide"); document.body.style.overflow=""; qcExterno=false }
$("#qcCanalSel").onchange=e=>pintarQCCanal(e.target.value);
$("#qcCancel").onclick=()=>{ const ext=qcExterno; fecharQC(); if(ext) location.hash="#/canais" };
$("#qc").onclick=e=>{ if(e.target.id==="qc"){ const ext=qcExterno; fecharQC(); if(ext) location.hash="#/canais" } };
$("#qcTxt").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) $("#qcSave").click() });
$("#qcColar").onclick=async()=>{
  try{
    const t=await navigator.clipboard.readText();
    if(t && /^https?:\/\//i.test(t.trim())) $("#qcRef").value=t.trim();
  }catch(e){ /* sem permissão ou API indisponível: ignora silenciosamente */ }
};
$("#qcSave").onclick=async()=>{
  const t=$("#qcTxt").value.trim();
  const ref=$("#qcRef").value.trim();
  if(!t && !ref) return fecharQC();
  const canalWrapVisivel = !$("#qcCanalWrap").classList.contains("hide");
  const canalId = canalWrapVisivel ? $("#qcCanalSel").value : qcAlvo;
  const c=criadores.find(x=>x.id===canalId);
  const isIdeias = c?.finalidade==="ideias";
  const linha=(t||ref).split("\n")[0].slice(0,120);
  const payload={criador_id:canalId, titulo:linha||"(sem título)", stage:qcStage};
  if(ref) payload.referencia=ref;
  if(isIdeias){
    if(t) payload.por_que=t;
    if(isIdeiaPost(c) && qcFoco.length){
      payload.foco=ordenaFoco(qcFoco);
      const sr=$("#qcSerie").value.trim();
      if(qcFoco.includes("serie") && sr) payload.serie=sr;
    }
  } else { payload.roteiro = t.length>linha.length ? t : ""; }
  const voltarHome=qcExterno;
  fecharQC();
  try{
    const [novo]=await db("psn_ideias",{method:"POST",body:JSON.stringify(payload)});
    ideias.unshift(novo);
    if(voltarHome) location.hash="#/canais"; else render();
    toast("Ideia salva");
  }catch(e){
    filaAdd(payload);
    if(voltarHome) location.hash="#/canais";
    toast("Sem internet — guardei no aparelho ⚡");
  }
};

let pend={}, pendId=null, pendTmr, aberta=null;
function salvarDepois(id, patch){
  if(pendId && pendId!==id) flush();
  pendId=id; Object.assign(pend,patch);
  clearTimeout(pendTmr); pendTmr=setTimeout(flush,600);
}
async function flush(){
  clearTimeout(pendTmr);
  if(!pendId || !Object.keys(pend).length) return;
  const id=pendId, body=pend; pend={};
  try{ await db("psn_ideias?id=eq."+id,{method:"PATCH",body:JSON.stringify(body)}) }
  catch(e){ toast("Não consegui salvar essa alteração",1) }
}

function stepperHTML(c){
  const k=STAGES.findIndex(s=>s.id===c.stage), prox=STAGES[k+1];
  return `<div class="trilha">${STAGES.map((s,j)=>
    `<button data-st="${s.id}" class="${j<k?"feito":""}${j===k?"on":""}"
      aria-label="Mover para ${esc(s.nome)}" title="${esc(s.nome)}"></button>`).join("")}</div>
    <div class="leg">
      <span class="at">${esc(STAGES[k].nome)}</span>
      ${prox?`<button class="prox" data-prox="1">Avançar para ${esc(prox.curto)} →</button>`:
        `<span class="rotulo" style="color:var(--acao-ganho)">Publicada ✦</span>`}
    </div>`;
}
function pintarStepper(c){
  $("#sStepper").innerHTML=stepperHTML(c);
  $("#sStepper").querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>mudarStage(c,b.dataset.st));
  const p=$("#sStepper").querySelector("[data-prox]");
  if(p) p.onclick=()=>{ const k=STAGES.findIndex(s=>s.id===c.stage); mudarStage(c,STAGES[k+1].id) };
}
function mudarStage(c,st){
  if(c.stage===st) return;
  c.stage=st; salvarDepois(c.id,{stage:st});
  pintarStepper(c); pintarChecklists(c);
  toast("→ "+STAGES.find(s=>s.id===st).curto);
}

function accHTML(cl,c,aberto){
  const n=cl.items.filter(t=>c.checks[cl.id+"::"+t]).length;
  return `<div class="acc ${aberto?"aberta":""}" data-cl="${cl.id}">
    <button class="acchead" type="button" aria-expanded="${aberto?"true":"false"}">
      <span class="nm">${esc(cl.nome)}</span>
      <span class="ct ${n===cl.items.length?"cheio":""}">${n}/${cl.items.length}</span>
      <span class="ct arrow">${aberto?"▴":"▾"}</span>
    </button>
    <div class="accbody ${aberto?"":"hide"}">${cl.items.map((t,i)=>{
      const k=cl.id+"::"+t, on=!!c.checks[k];
      return `<div class="item ${on?"done":""}">
        <input type="checkbox" id="ck_${cl.id}_${i}" data-k="${esc(k)}" ${on?"checked":""}>
        <label for="ck_${cl.id}_${i}">${md(t)}</label></div>`}).join("")}</div></div>`;
}

function pintarChecklists(c){
  const rel=CL_POR_STAGE[c.stage]||[];
  const agora=CHECKLISTS.filter(cl=>rel.includes(cl.id));
  const resto=CHECKLISTS.filter(cl=>!rel.includes(cl.id));
  const box=$("#sChecks");
  box.innerHTML=`
    ${agora.length?`<div class="grupo-tit"><span class="agora">AGORA</span>
      <span class="t">${esc(STAGES.find(s=>s.id===c.stage).curto)}</span><span class="l"></span></div>
      ${agora.map(cl=>accHTML(cl,c,true)).join("")}`:
      `<div class="grupo-tit"><span class="t">Nesta etapa o trabalho é escrever, não marcar</span><span class="l"></span></div>`}
    <div class="grupo-tit"><span class="t">Outras listas</span><span class="l"></span>
      <span class="ct rotulo" style="color:var(--texto-fraco)">${score(c).n}/${TOTAL}</span></div>
    ${resto.map(cl=>accHTML(cl,c,false)).join("")}`;
  ligarChecks(c);
}

function ligarChecks(c){
  $("#sChecks").querySelectorAll(".acchead").forEach(h=>h.onclick=()=>{
    const b=h.nextElementSibling, fechado=b.classList.toggle("hide");
    h.setAttribute("aria-expanded",String(!fechado));
    h.closest(".acc").classList.toggle("aberta",!fechado);
    h.querySelector(".arrow").textContent=fechado?"▾":"▴";
  });
  $("#sChecks").querySelectorAll("input[type=checkbox]").forEach(cb=>cb.onchange=()=>{
    c.checks[cb.dataset.k]=cb.checked;
    cb.closest(".item").classList.toggle("done",cb.checked);
    const acc=cb.closest(".acc"), cl=CHECKLISTS.find(x=>x.id===acc.dataset.cl);
    const n=cl.items.filter(t=>c.checks[cl.id+"::"+t]).length;
    const ct=acc.querySelector(".ct");
    ct.textContent=n+"/"+cl.items.length;
    ct.classList.toggle("cheio",n===cl.items.length);
    pintarTopo(c);
    salvarDepois(c.id,{checks:c.checks});
  });
}

/* ============ MÉTRICAS (Instagram · leitura anon das tabelas psn_ig_*) ============ */
const TZ="America/Sao_Paulo";
const hojeSP=()=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date());
const addDias=(s,n)=>{ const d=new Date(s+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10) };
const difDias=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);
const faixaDias=(a,b)=>{ const r=[]; for(let d=a; d<=b; d=addDias(d,1)) r.push(d); return r };
const fmtDM=s=>s.slice(8,10)+"/"+s.slice(5,7);
const fmtDMA=s=>fmtDM(s)+"/"+s.slice(0,4);
const fmtInt=n=>(n==null||isNaN(n))?"—":Math.round(n).toLocaleString("pt-BR");
const fmtPct=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
function fmtQuando(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  const p=Object.fromEntries(new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d).map(x=>[x.type,x.value]));
  return p.day+"/"+p.month+" "+p.hour+":"+p.minute;
}
const MET_PERIODOS=[["7","7 dias"],["28","28 dias"],["90","90 dias"],["custom","Personalizado"]];
let MET={periodo:"28",de:"",ate:"",dados:null,chave:"",carregando:false,erro:false,seq:0};

function metIntervalo(){
  let de,ate;
  if(MET.periodo==="custom" && MET.de && MET.ate && MET.de<=MET.ate){ de=MET.de; ate=MET.ate }
  else { const n=MET.periodo==="custom"?28:+MET.periodo; ate=addDias(hojeSP(),-1); de=addDias(ate,-(n-1)) }
  const n=difDias(de,ate)+1, pAte=addDias(de,-1), pDe=addDias(pAte,-(n-1));
  return {de,ate,n,pDe,pAte};
}
/* paginação por limit/offset (PostgREST limita a 1000 linhas por resposta) */
async function dbTodas(path){
  const out=[]; const sep=path.includes("?")?"&":"?";
  for(let off=0; off<50000; off+=1000){
    const r=await db(path+sep+"limit=1000&offset="+off)||[];
    out.push(...r); if(r.length<1000) break;
  }
  return out;
}
async function carregarMetricas(){
  const iv=metIntervalo(), chave=[iv.pDe,iv.ate].join("|"), seq=++MET.seq;
  MET.carregando=true; MET.erro=false;
  try{
    const [snapUlt,analise,sync,cfg]=await Promise.all([
      db("psn_ig_conta_snapshot?select=data,seguidores&order=data.desc&limit=1"),
      db("psn_ig_analise?select=*&order=data.desc&limit=1"),
      db("psn_ig_sync?select=*&order=iniciado_em.desc&limit=1"),
      db("psn_ig_config?select=chave,valor,atualizado_em&chave=in.(token_saude,ultima_coleta_ok)")
    ]);
    const ancora=snapUlt&&snapUlt[0]?snapUlt[0].data:null;
    const topo=ancora&&ancora>iv.ate?ancora:iv.ate;
    const [diaria,snaps]=await Promise.all([
      dbTodas("psn_ig_conta_diaria?select=data,metrica,valor&data=gte."+iv.pDe+"&data=lte."+topo+"&order=data.asc,metrica.asc"),
      dbTodas("psn_ig_conta_snapshot?select=data,seguidores&data=gte."+iv.pDe+"&data=lte."+topo+"&order=data.asc")
    ]);
    if(seq!==MET.seq) return;
    const mapa={}; diaria.forEach(r=>{ (mapa[r.data]??={})[r.metrica]=r.valor==null?null:Number(r.valor) });
    const conf={}; (cfg||[]).forEach(r=>conf[r.chave]=r);
    MET.dados={chave,iv,mapa,nDiaria:diaria.length,snaps,snapUlt:snapUlt&&snapUlt[0]||null,
      analise:analise&&analise[0]||null,sync:sync&&sync[0]||null,conf};
    MET.chave=chave;
  }catch(e){ console.error(e); if(seq===MET.seq){ MET.erro=true; MET.dados=null } }
  if(seq===MET.seq){ MET.carregando=false; if(location.hash==="#/metricas") renderMetricas() }
}
/* LAST para seguidores, SUM para fluxos; null quando não há nenhuma linha da métrica */
function somaMet(mapa,chaves,de,ate){
  let s=0,achou=false;
  for(let d=de; d<=ate; d=addDias(d,1)){ const m=mapa[d]; if(!m) continue;
    for(const k of chaves) if(m[k]!=null){ s+=m[k]; achou=true } }
  return achou?s:null;
}
/* reconstrói seguidores: âncora no snapshot mais recente, propaga com follower_count (delta) */
function reconstruirSeguidores(mapa,snaps,snapUlt,de,ate){
  const sn={}; snaps.forEach(s=>{ if(s.seguidores!=null) sn[s.data]=s.seguidores });
  if(snapUlt&&snapUlt.seguidores!=null) sn[snapUlt.data]=snapUlt.seguidores;
  const out={}; const ds=Object.keys(sn).sort(); if(!ds.length) return out;
  const temDelta=Object.values(mapa).some(m=>m.follower_count!=null);
  if(!temDelta){ ds.forEach(d=>{ if(d>=de&&d<=ate) out[d]=sn[d] }); return out }
  const anc=ds[ds.length-1], ini=de<anc?de:anc, fim=ate>anc?ate:anc;
  const dias=faixaDias(ini,fim), ai=dias.indexOf(anc), r={}; r[anc]=sn[anc];
  const dl=d=>(mapa[d]&&mapa[d].follower_count)||0;
  for(let i=ai+1;i<dias.length;i++) r[dias[i]]=sn[dias[i]]??r[dias[i-1]]+dl(dias[i]);
  for(let i=ai-1;i>=0;i--) r[dias[i]]=sn[dias[i]]??r[dias[i+1]]-dl(dias[i+1]);
  dias.forEach(d=>{ if(d>=de&&d<=ate) out[d]=r[d] });
  return out;
}
function deltaHTML(cur,prev){
  if(cur==null||prev==null||prev===0) return `<span class="d">—</span>`;
  const p=(cur-prev)/Math.abs(prev)*100;
  if(Math.abs(p)<0.05) return `<span class="d">= 0,0%</span>`;
  return `<span class="d ${p>0?"up":"down"}">${p>0?"▲":"▼"} ${fmtPct(Math.abs(p))}</span>`;
}
function metKpis(D){

  if(ganho==null){ const a=seg[iv.de], b=seg[iv.ate]; if(a!=null&&b!=null) ganho=b-a }
  const sinal=n=>(n>0?"+":n<0?"−":"")+fmtInt(Math.abs(n));

    s:ganho==null?"":"no período"});
  const flux=(k,ch)=>{ const c=S(ch,iv.de,iv.ate), p=S(ch,iv.pDe,iv.pAte); return {k,v:c,d:deltaHTML(c,p),s:""} };
  lst.push(flux("Alcance",["reach"]), flux("Views",["views"]), flux("Contas engajadas",["accounts_engaged"]));
  const sc=S(["saves","shares"],iv.de,iv.ate), sp=S(["saves","shares"],iv.pDe,iv.pAte);

/* ---------- gráficos SVG ---------- */
function ticksBonitos(lo,hi,n){
  let r=(hi-lo)||Math.max(1,Math.abs(hi)*.1), passo=r/n, p=Math.pow(10,Math.floor(Math.log10(passo))), f=passo/p;
  passo=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const a=Math.floor(lo/passo)*passo, b=Math.ceil(hi/passo)*passo, t=[];
  for(let v=a; v<=b+passo/1e6; v+=passo) t.push(Math.round(v*1e6)/1e6);
  return t;
}
/* cfg: datas[], series[{nome,cor,vals[]}], tipo "linha"|"barras", zero, ligar */
function desenharGrafico(el,cfg){
  const {datas,series,tipo}=cfg, n=datas.length;
  const todos=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!todos.length){ el.innerHTML=`<div class="msemdados">Sem dados neste período.</div>`; return }
  const W=Math.max(260,el.clientWidth||320), H=cfg.h||210, L=46, R=10, T=10, B=26, iw=W-L-R, ih=H-T-B;
  let lo=cfg.zero===false?Math.min(...todos):0, hi=Math.max(...todos);
  if(tipo==="barras") lo=Math.min(0,lo);
  const tk=ticksBonitos(lo,hi,4), y0=tk[0], y1=tk[tk.length-1];
  const Y=v=>T+ih-(v-y0)/((y1-y0)||1)*ih;
  const banda=iw/n, X=i=>tipo==="barras"?L+banda*(i+.5):(n===1?L+iw/2:L+i*iw/(n-1));
  const sa=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/58))));
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.rotulo||"gráfico")}" data-pts="${series.reduce((a,s)=>a+s.vals.filter(v=>v!=null).length,0)}">`;
  tk.forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(28,18,37,${v===0?.28:.09})" stroke-width="1"/>
    <text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${esc(fmtInt(v))}</text>` });
  for(let i=0;i<n;i+=1) if(i%sa===0) g+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle">${fmtDM(datas[i])}</text>`;
  series.forEach((s,si)=>{
    if(tipo==="barras"){
      const bw=Math.max(1.5,Math.min(18,banda*.72));
      s.vals.forEach((v,i)=>{ if(v==null) return; const yy=Y(Math.max(v,0)), h=Math.max(1,Math.abs(Y(v)-Y(0)));
        g+=`<rect class="bar" x="${X(i)-bw/2}" y="${Math.min(Y(v),Y(0))}" width="${bw}" height="${h}" rx="${Math.min(3,bw/2)}" fill="${s.cor}"/>` });
    } else {
      let d="",pen=false;
      s.vals.forEach((v,i)=>{ if(v==null){ if(!cfg.ligar) pen=false; return }
        d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); pen=true });
      g+=`<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  });
  g+=`<line class="cross" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="rgba(28,18,37,.35)" stroke-width="1" style="display:none"/>`;
  series.forEach((s,si)=>{ g+=`<circle class="mk" data-s="${si}" r="4.5" fill="${s.cor}" stroke="#fff" stroke-width="2" style="display:none"/>` });
  g+=`</svg><div class="mtip"></div>`;
  el.innerHTML=g;
  const svg=el.querySelector("svg"), tip=el.querySelector(".mtip"), cr=svg.querySelector(".cross"), mks=[...svg.querySelectorAll(".mk")];
  const fm=cfg.fmt||fmtInt;
  function mostrar(ev){
    const r=svg.getBoundingClientRect(), x=(ev.clientX-r.left)*(W/r.width);
    let i=tipo==="barras"?Math.floor((x-L)/banda):Math.round((x-L)/(iw/Math.max(1,n-1)));
    i=Math.max(0,Math.min(n-1,i)); const cx=X(i);
    cr.setAttribute("x1",cx); cr.setAttribute("x2",cx); cr.style.display="";
    mks.forEach((m,si)=>{ const v=series[si].vals[i]; if(v==null){ m.style.display="none" } else { m.setAttribute("cx",cx); m.setAttribute("cy",Y(v)); m.style.display="" } });
    tip.innerHTML=`<b>${fmtDMA(datas[i])}</b>`+series.map(s=>`<div><i style="background:${s.cor}"></i>${series.length>1?esc(s.nome)+": ":""}${s.vals[i]==null?"—":esc(fm(s.vals[i]))}</div>`).join("");
    tip.classList.add("on");
    const px=cx*(r.width/W), tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(r.width-tw,px+12>r.width-tw?px-tw-12:px+12))+"px";
    tip.style.top=(T)+"px";
  }
  const esconder=()=>{ tip.classList.remove("on"); cr.style.display="none"; mks.forEach(m=>m.style.display="none") };
  svg.addEventListener("pointermove",mostrar); svg.addEventListener("pointerdown",mostrar);
  svg.addEventListener("pointerleave",ev=>{ if(ev.pointerType!=="touch") esconder() });
}

function metAvisos(D){
  const av=[]; const s=D.sync, tk=D.conf.token_saude&&D.conf.token_saude.valor;
  if(s&&s.status==="erro"){
    let det=""; if(s.detalhe){ det=typeof s.detalhe==="string"?s.detalhe:(s.detalhe.erro||s.detalhe.error||s.detalhe.mensagem||s.detalhe.message||"") }
    av.push(`<b>A última coleta não terminou.</b> As métricas abaixo podem estar um pouco atrasadas; a próxima rodada tenta de novo.${det?` <span style="color:var(--texto-fraco)">(${esc(String(det).slice(0,140))})</span>`:""}`);
  }
  if(tk&&tk.valido===false) av.push(`<b>O acesso ao Instagram precisa ser renovado.</b> O token deixou de valer, então novas métricas não entram até ele ser gerado de novo.`);
  else if(tk){
    // vale o que vencer primeiro: o token em si ou o acesso a dados (90 dias, mesmo com token "sem expiração")
    const datas=[tk.expira_em,tk.acesso_dados_expira_em].filter(Boolean).map(d=>new Date(d)).filter(d=>!isNaN(d));
    const ex=datas.length?new Date(Math.min(...datas)):null;
    if(ex){ const dias=Math.floor((ex-new Date())/864e5);
      if(!isNaN(dias)&&dias<10) av.push(`<b>O token do Instagram vence ${dias<=0?"hoje ou já venceu":"em "+dias+" dia"+(dias===1?"":"s")}.</b> Vale renovar com calma antes disso para a coleta não parar.`) }
  }
  return av;
}
function metQuandoColeta(D){
  const c=D.conf.ultima_coleta_ok&&D.conf.ultima_coleta_ok.valor; let iso=null;
  if(typeof c==="string") iso=c;
  else if(c&&typeof c==="object") iso=c.em||c.at||c.quando||c.data||c.finalizado_em||Object.values(c).find(v=>typeof v==="string"&&!isNaN(new Date(v)))||null;
  if(!iso&&D.conf.ultima_coleta_ok) iso=D.conf.ultima_coleta_ok.atualizado_em;
  if(!iso&&D.sync) iso=D.sync.finalizado_em||D.sync.iniciado_em;
  return iso;
}

/* ---------- horários do público (psn_ig_horarios) ---------- */
/* devolve {fonte, dias:[7 × [{h,ini,fim,pico,v}] em ordem cronológica, top = índice da mais forte]} ou null sem dados */
function hjHorarios(){
  if(HJ.horCache&&HJ.horCache.src===HJ.horarios) return HJ.horCache.val;
  let val=null; const rows=(HJ.horarios||[]).filter(r=>r.valor!=null&&+r.valor>0);
  if(rows.length){
    const fonte=rows.some(r=>r.fonte==="online_followers")?"online_followers":"historico";
    const dias=[0,1,2,3,4,5,6].map(d=>{
      const rs=rows.filter(r=>r.fonte===fonte&&+r.dia_semana===d).sort((a,b)=>b.valor-a.valor); if(!rs.length) return null;
      const a=rs[0], b=rs.find(r=>Math.abs(r.hora-a.hora)>=2), sel=[a,b].filter(Boolean);
      const fs=sel.map(r=>({h:+r.hora,ini:hjPad(r.hora)+":00",fim:hjPad((+r.hora+1)%24)+":00",pico:hjPad(r.hora)+":00",v:+r.valor}));
      const topH=fs[0].h; fs.sort((x,y)=>x.h-y.h); return {fs,top:fs.findIndex(f=>f.h===topH)};
    });
    if(dias.some(Boolean)) val={fonte,dias};
  }
  HJ.horCache={src:HJ.horarios,val}; return val;
}
function hjHorDia(iso){ const H=hjHorarios(); return H?H.dias[hjDow(iso)]:null }
/* estático = pico da faixa mais forte; Reels = pico da outra faixa (os dois não colidem) */
function hjSugHora(iso,f){
  const d=hjHorDia(iso); if(!d) return null; const top=d.fs[d.top], outra=d.fs.find((_,i)=>i!==d.top);
  return (f==="estatico"?top:(outra||top)).pico;
}
function hjHoraDe(p){   // {hm, editado} — agendado_para (se editado) → horario_sugerido → melhor horário do dia
  const dia=hjDiaDaPauta(p)||(HJ.alvo&&HJ.alvo.dia)||hjHoje();
  if(p.agendado_para){ const hm=hjHM(p.agendado_para), sug=p.horario_sugerido?hjHM(p.horario_sugerido):"";
    return {hm,editado:!sug||sug!==hm}; }
  if(p.horario_sugerido) return {hm:hjHM(p.horario_sugerido),editado:false};
  const s=hjSugHora(dia,p.formato); return {hm:s,editado:false};
}

/* ---------- previsão de produção: rodada de hora em hora, 07–20h BRT, ~30 min por pauta ---------- */
function hjPrev(base){
  const s=hjSP(base||hjAgora()); let slot=s.H+1, amanha=false;
  if(slot<7) slot=7; if(slot>20){ slot=7; amanha=true }
  const pronto=hjPad(slot)+":30";
  return {rodada:hjPad(slot)+":00",pronto,amanha,txt:amanha?"amanhã ~"+pronto:"até ~"+pronto};
}
function hjProxColeta(){   // pg_cron '5 */4 * * *' (UTC) = 21:05, 01:05, 05:05, 09:05, 13:05, 17:05 em Brasília
  const s=hjSP(hjAgora()), min=s.H*60+s.M, slots=[65,305,545,785,1025,1265];
  const n=slots.find(x=>x>min)??slots[0]; return hjPad(Math.floor(n/60))+":"+hjPad(n%60);
}

/* ---------- carga ---------- */
async function hjCarregar(forcar){
  if(HJ.carregando) return;
  if(HJ_DEMO){ HJ.mut++; hjMontarDemo(); HJ.pronto=true; HJ.erro=false; HJ.carregadoEm=Date.now(); return hjAtualizarTela() }
  const seq=++HJ.seq, mut0=HJ.mut; HJ.carregando=true; if(!HJ.pronto) HJ.erro=false;
  const hoje=hjHoje(), ok=p=>p.catch(e=>{ console.error(e); return null });
  try{
    const [pautas,dia]=await Promise.all([
      dbTodas("psn_pauta?select="+HJ_COLS+"&order=criado_em.desc,id.asc"),
      db("psn_pauta_dia?select=*&data=lte."+hoje+"&order=data.desc&limit=1")
    ]);
    const [analise,horarios,diaria,midias]=await Promise.all([
      ok(db("psn_ig_analise?select=data,analise,sinal_pauta&data=lte."+hoje+"&order=data.desc&limit=2")),
      ok(db("psn_ig_horarios?select=dia_semana,hora,valor,fonte")),
      ok(db("psn_ig_conta_diaria?select=data,metrica,valor&data=gte."+addDias(hoje,-5)+"&data=lte."+hoje+"&order=data.desc")),
      ok(db("psn_ig_midia?select=id,tipo,tipo_produto,legenda,permalink,publicado_em&order=publicado_em.desc&limit=500"))
    ]);
    if(seq!==HJ.seq) return;
    /* ação do usuário durante a carga: mantém o estado local (a próxima carga acerta) */
    if(HJ.mut===mut0&&!HJ.pend.size) HJ.pautas=pautas||[];
    HJ.dia=(dia&&dia[0]&&dia[0].data===hoje)?dia[0]:null; HJ.diaUlt=(dia&&dia[0])||null; HJ.analise=analise||[]; HJ.horarios=horarios||[]; HJ.midias=midias||[];
    HJ.ontem=hjOntem(diaria,hoje);
    HJ.pronto=true; HJ.erro=false; HJ.carregadoEm=Date.now();
    hjCarimbarVisto();
  }catch(e){ console.error(e); if(seq===HJ.seq&&!HJ.pronto) HJ.erro=true }
  if(seq===HJ.seq) HJ.carregando=false;
  hjAtualizarTela();
}
/* números de ontem: mesmas funções do módulo Métricas (somaMet/fmtInt); usa o último dia com alcance até ontem */
function hjOntem(rows,hoje){
  if(!rows||!rows.length) return null;
  const mapa={}; rows.forEach(r=>{ (mapa[r.data]??={})[r.metrica]=r.valor==null?null:Number(r.valor) });
  const ds=Object.keys(mapa).filter(d=>d<hoje&&mapa[d].reach!=null).sort(); if(!ds.length) return null;
  const d=ds[ds.length-1];
  return {data:d,reach:somaMet(mapa,["reach"],d,d),saves:somaMet(mapa,["saves"],d,d),shares:somaMet(mapa,["shares"],d,d)};
}
/* primeira abertura do dia: psn_pauta_dia.visto_em (o trigger ignora se já houver valor) */
function hjCarimbarVisto(){
  if(HJ_DEMO||HJ.vistoOk||!HJ.dia||HJ.dia.visto_em) return;
  HJ.vistoOk=true; const agora=new Date().toISOString();
  hjPatch("psn_pauta_dia?data=eq."+HJ.dia.data+"&visto_em=is.null&select=data,visto_em",{visto_em:agora}).then(r=>{ if(r&&r[0]&&HJ.dia) HJ.dia.visto_em=r[0].visto_em }).catch(e=>console.error(e));
}
async function hjPatch(path,body,keep){
  const res=await fetch(SB_URL+"/rest/v1/"+path,{method:"PATCH",keepalive:!!keep,
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); const er=new Error(t); er.status=res.status; throw er }
  const t=await res.text(); return t?JSON.parse(t):[];
}

/* ---------- gravação adiada (Desfazer de 5 s) ---------- */
function hjToast(msg,desfazer,err){
  const t=$("#toast"), b=$("#toastBtn");
  $("#toastTxt").textContent=msg; t.className="toast on"+(err?" err":"")+(desfazer?" comdes":"");
  if(desfazer){ b.classList.remove("hide"); b.onclick=()=>{ t.classList.remove("on"); clearTimeout(tt); desfazer() } }
  else { b.classList.add("hide"); b.onclick=null }
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),desfazer?5000:err?4500:2600);
}
/* aplica já na tela, mostra o toast com Desfazer e só manda o PATCH depois de 5 s */
function hjAcao(id,patch,msg,depois){
  const p=hjGet(id); if(!p) return null;
  HJ.pend.forEach(it=>{ if(it.id===id) hjCommit(it) });   // grava antes o que já estava pendente nesta pauta
  const antes={}; Object.keys(patch).forEach(k=>{ antes[k]=p[k] });
  Object.assign(p,patch); HJ.mut++;
  const item={id,patch,antes,feito:false,t:null}; item.t=setTimeout(()=>hjCommit(item),5000); HJ.pend.add(item);
  hjAtualizarTela();
  hjToast(msg,()=>{ if(item.feito) return; clearTimeout(item.t); HJ.pend.delete(item);
    const q=hjGet(id); if(q) Object.assign(q,antes); HJ.mut++; hjAtualizarTela() });
  if(depois) depois();
  return item;
}
function hjCommit(item,keep){
  if(item.feito) return Promise.resolve(); item.feito=true; clearTimeout(item.t); HJ.pend.delete(item);
  const prev=HJ.cadeia[item.id]||Promise.resolve();
  const run=prev.then(async()=>{
    try{
      if(HJ_DEMO) return;   // modo de teste: nunca grava
      const rows=await hjPatch("psn_pauta?id=eq."+item.id+"&select="+HJ_COLS,item.patch,keep);
      if(!rows||!rows.length){ const er=new Error("nenhuma linha atualizada"); er.vazio=true; throw er }
      const q=hjGet(item.id); if(q&&![...HJ.pend].some(x=>x.id===item.id)) Object.assign(q,rows[0]);
    }catch(e){
      console.error(e); const q=hjGet(item.id); if(q) Object.assign(q,item.antes); HJ.mut++;
      const recusado=e.vazio||(e.status>=400&&e.status<500);   // trigger recusou ou a linha já mudou
      hjToast(recusado?"Isso já mudou em outro lugar. Atualizei a tela.":HJ_ERRO_GRAVAR,null,true); hjAtualizarTela();
      if(recusado&&!HJ.pend.size){ HJ.carregadoEm=0; hjCarregar() }
    }
  });
  HJ.cadeia[item.id]=run; return run;
}
function hjGravarTudo(){   // página escondida: grava na hora (keepalive) e tira o Desfazer
  if(!HJ.pend.size) return;
  [...HJ.pend].forEach(it=>hjCommit(it,true)); $("#toast").classList.remove("on");
}

function hjVaga(dia,f){

  if(dia<hjHoje()){   // histórico: post real do Instagram sem pauta casada

}

  const C=HJ.cal, HH=hjHorarios(), dow=hjDow(hoje);

      ${[1,2,3,4,5,6,0].map(d=>{ const x=HH.dias[d]; return `<div class="hrow2 ${d===dow?"hj":""}"><b>${HJ_DIAS3[d]}</b>${x?x.fs.map((f,i)=>`<span class="faixa ${i===x.top?"top":""}">${f.ini}–${f.fim}</span>`).join(""):`<span class="faixa">sem dados</span>`}</div>` }).join("")}`
      :`<p class="dica" style="margin-top:0">Os horários aparecem quando houver dados suficientes.</p>`}</div>
    <div class="destaque" style="margin-top:0"><div class="t">Postado é automático</div><p style="margin:0;font-size:var(--t-mini);line-height:1.45">Quando o post aparece no Instagram (o app olha a cada 4 h), a vaga vira “postado” sozinha, com o horário real. Se demorar, abra a pauta e toque em “Marquei como postado”.</p></div>`;
  const seg=`<div class="seg seg2" role="group" aria-label="Visão do calendário"><button class="${C.vista==="semana"?"on":""}" data-hj="vista" data-v="semana">Semana</button><button class="${C.vista==="mes"?"on":""}" data-hj="vista" data-v="mes">Mês</button></div>`;
  let corpo="";

    const ini=C.ini, fim=addDias(ini,6), a=+ini.slice(5,7), b=+fim.slice(5,7);

    corpo=`<div class="cnav"><button class="icb" data-hj="nav" data-v="-1" aria-label="Semana anterior">‹</button><div class="t">${tit}</div><button class="icb" data-hj="nav" data-v="1" aria-label="Próxima semana">›</button></div>
      ${ini!==hjSegunda(hoje)?`<div style="text-align:center;margin-bottom:var(--e3)"><button class="btn-mini" data-hj="hoje-cal">Voltar para hoje</button></div>`:""}
      ${[0,1,2,3,4,5,6].map(i=>{ const d=addDias(ini,i); return `<section class="cdia ${d===hoje?"hoje":""}"><h3>${HJ_DIAS[hjDow(d)]} ${+d.slice(8,10)}${d===hoje?` <span class="chip">hoje</span>`:""}</h3><div class="vagas">${hjVagaHTML(d,"estatico")}${hjVagaHTML(d,"reels")}</div></section>` }).join("")}`;
  } else {
    const [y,m]=C.mes.split("-").map(Number), ult=new Date(Date.UTC(y,m,0)).getUTCDate(), lead=(hjDow(C.mes+"-01")+6)%7;
    if(!C.sel.startsWith(C.mes)) C.sel=C.mes===hoje.slice(0,7)?hoje:C.mes+"-01";
    let cel=""; for(let i=0;i<lead;i++) cel+=`<span></span>`;
    for(let n=1;n<=ult;n++){ const d=C.mes+"-"+hjPad(n), e=hjVaga(d,"estatico"), r=hjVaga(d,"reels");
      cel+=`<button class="dia ${d===hoje?"hoje":""} ${d===C.sel?"sel":""}" data-hj="dia" data-v="${d}" aria-label="${n} de ${HJ_MESES[m-1]}: Estático ${e.estado}, Reels ${r.estado}" ${d===C.sel?'aria-pressed="true"':""}><span>${n}</span><span class="dots"><i class="dot d-${HJ_VCLS[e.estado]}"></i><i class="dot d-${HJ_VCLS[r.estado]}"></i></span></button>` }

      <p class="dica">Em cada dia: primeiro ponto = estático, segundo = Reels.</p>
      <section class="cdia painel-dia ${C.sel===hoje?"hoje":""}"><h3>${HJ_DIAS[hjDow(C.sel)]}, ${+C.sel.slice(8,10)} de ${HJ_MESES[+C.sel.slice(5,7)-1]}${C.sel===hoje?` <span class="chip">hoje</span>`:""}</h3><div class="vagas">${hjVagaHTML(C.sel,"estatico")}${hjVagaHTML(C.sel,"reels")}</div></section>`;
  }
  return {corpo:hor+seg+corpo};
}

/* ---------- FICHA ---------- */
function hjEmUmaHora(){
  const s=hjSP(hjAgora()); let min=Math.ceil((s.H*60+s.M+60)/5)*5;
  if(min>=22*60) return "21:30"; return hjPad(Math.floor(min/60))+":"+hjPad(min%60);
}
function hjHoraBloco(p){
  const hoje=hjHoje(), dia=hjDiaDaPauta(p)||(HJ.alvo&&HJ.alvo.dia)||hoje, H=hjHoraDe(p), hd=hjHorDia(dia);
  const terc=dia===hoje?[hjEmUmaHora(),"em ~1 h"]:["08:00","cedo"];
  let ops=hd?[[hd.fs[hd.top].pico,"melhor horário"],...(hd.fs.length>1?[[hd.fs.find((_,i)=>i!==hd.top).pico,"2ª faixa"]]:[]),terc]:[["08:00","cedo"],["12:00","meio-dia"],["19:00","noite"]];
  ops=ops.filter((o,i)=>ops.findIndex(x=>x[0]===o[0])===i);
  return `<div class="fbloco"><div class="blocohead"><h3>Agendado para</h3><button class="btn-mini" data-hj="mudar-hora" aria-expanded="${HJ.hora}">${HJ.hora?"Fechar":"Mudar horário"}</button></div>
    <div class="hora-atual"><span class="num">${H.hm||"—"}</span><span>${hjDiaTxt(dia)}</span>${H.hm?`<span class="chip ${H.editado?"":"chip-neutro"}">${H.editado?"escolhido por você":"sugerido"}</span>`:""}</div>
    <p class="dica">${hd?`Faixas fortes de ${HJ_DIAS[hjDow(dia)]}: ${hd.fs.map(x=>x.ini+"–"+x.fim).join(" e ")}.`:"Os horários aparecem quando houver dados suficientes."}</p>
    ${HJ.hora?`<div class="hora-ops" role="group" aria-label="Opções rápidas de horário">${ops.map(([x,n])=>`<button class="filtro ${x===H.hm?"on":""}" data-hj="hora" data-v="${x}">${x} · ${n}</button>`).join("")}</div>
      <label class="lbl" for="horaIn" style="margin-top:var(--e2)">Outro horário</label><div class="hmanual"><input type="time" class="campo" id="horaIn" value="${hjE(H.hm||"")}"><button class="btn btn-ganho" data-hj="salvar-hora">Usar</button></div>`:""}</div>`;
}
function hjCenasHTML(p){ return hjCenas(p).map((c,i)=>`<div class="cena ${i===0?"gancho-cena":""}"><span class="cena-n">${i+1}</span><div><div class="cena-c">[${hjE(c.c)}]<span class="cena-t">${hjE(c.t)}</span></div><div class="cena-f">${i===0?"Gancho falado: ":""}“${hjE(c.f)}”</div></div></div>`).join("") }
function hjRenderFicha(id){

    if(p.status==="postado"){ const l=hjPermalink(p); if(l) h+=`<p style="margin:var(--e3) 0"><a class="linkb" href="${hjE(l)}" target="_blank" rel="noopener">ver no Instagram ↗</a></p>` }
    if(!reels){
      if(slides.length){
        h+=`<div class="tira" id="tira" tabindex="0" aria-label="Slides do carrossel, deslize para o lado">${slides.map((u,i)=>hjImg(u,i,slides.length)).join("")}</div>
          <div class="tirainfo"><span id="tiraN">1 de ${slides.length} · deslize</span><span class="pontos" id="pontos">${slides.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</span></div>`;
      } else h+=`<div class="maviso" style="margin-top:var(--e3)">Os slides desta pauta ainda não chegaram.</div>`;
      h+=p.avisos?`<div class="maviso" style="margin-top:var(--e3)"><b>Conferência automática:</b> ${hjE(p.avisos)}</div>`:(slides.length?`<p class="semdesc">Conferência automática sem avisos.</p>`:"");

        <details style="margin-top:var(--e3)"><summary style="cursor:pointer;font-size:var(--t-micro);font-weight:700;color:var(--texto-fraco);min-height:32px;display:flex;align-items:center">Texto corrido para copiar</summary><pre class="txtlongo" id="reelsTx">${hjE(hjRoteiroTxt(p))}</pre></details></div>${p.avisos?`<div class="maviso" style="margin-top:var(--e3)"><b>Aviso da produção:</b> ${hjE(p.avisos)}</div>`:""}`;

       <p class="dica">A rotina lê isto e refaz só o que você pediu.</p>

    if(p.legenda) h+=`<div class="fbloco"><div class="blocohead"><h3>Legenda</h3><button class="btn-mini" data-hj="copiar-leg" data-id="${p.id}">⧉ Copiar legenda</button></div><pre class="txtlongo" id="legTx">${hjE(p.legenda)}</pre></div>`;
    if(p.status!=="postado") h+=hjHoraBloco(p);
    if(p.status==="aprovado") h+=`<div class="destaque"><div class="t">Postado é automático</div><p style="margin:0;font-size:var(--t-mini);line-height:1.45">Quando o post aparecer no Instagram (coleta a cada 4 h, próxima ~${hjProxColeta()}), esta pauta vira “postado” sozinha. Se você já postou e ainda não apareceu, use “Marquei como postado”.</p></div>`;
    if(p.gancho||p.fontes||p.ajuste_pre) h+=`<details class="fbloco"><summary style="cursor:pointer;font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-medio);min-height:28px">Proposta original e fontes</summary>
        ${p.gancho?`<p style="margin-top:var(--e2)"><b>${reels?"Gancho falado":"Gancho"}:</b> ${hjE(p.gancho)}</p>`:""}${p.fontes?`<p style="margin-top:var(--e2)"><b>Fontes:</b> ${hjE(p.fontes)}</p>`:""}${p.ajuste_pre?`<div class="coment">Seu pedido antes de produzir: “${hjE(p.ajuste_pre)}”</div>`:""}</details>`;
    if(["para_revisar","aprovado"].includes(p.status)) h+=`<div style="margin-top:var(--e6)"><button class="btn btn-risco" data-hj="lixeira" data-id="${p.id}" style="width:100%">Não vou postar este</button></div>`;

    if(rs.length&&!reels) h+=`<div class="fbloco"><h3>O que cada slide diz <span class="chip chip-neutro">${rs.length} slides</span></h3><ol>${rs.map(r=>`<li>${hjE(r)}</li>`).join("")}</ol></div>`;
    if(cenas.length) h+=`<div class="fbloco"><h3>Cenas <span class="chip chip-neutro">${cenas.length} cenas${p.dur?" · "+hjE(p.dur):""}</span></h3>${hjCenasHTML(p)}</div>`;
    if(pq.length) h+=`<div class="fbloco"><h3>Por quê</h3><ul>${pq.map(x=>`<li><b>${hjE(x.tipo||"")}:</b> ${hjE(x.texto)}</li>`).join("")}</ul></div>`;
    if(p.fontes) h+=`<div class="fbloco"><h3>Fontes</h3><p>${hjE(p.fontes)}</p></div>`;
