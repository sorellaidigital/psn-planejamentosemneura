<title>Hoje no PSN</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,500;0,700;1,700&family=Covered+By+Your+Grace&display=swap");
:root{
  /* tokens copiados de app/index.html (PSN 3.0) */
  --superficie-territorio:#4A16A8;
  --superficie-territorio-alta:#5C21C6;
  --superficie-territorio-baixa:#3B0F87;
  --superficie-trabalho:#F2EFFA;
  --superficie-cartao:#FFFFFF;
  --superficie-cartao-territorio:rgba(242,239,250,.10);
  --superficie-peso:#1C1225;
  --acao-ganho:#D7FF3E;
  --sobre-ganho:#1C1225;
  --selo-valor:#6E2639;
  --alerta:#FF2D55;
  --alerta-texto:#C4102F;
  --ok-texto:#17683A;
  --texto-forte:#1C1225;
  --texto-medio:#4B4160;
  --texto-fraco:#6C6285;
  --texto-invertido:#F2EFFA;
  --texto-invertido-medio:rgba(242,239,250,.74);
  --texto-invertido-fraco:rgba(242,239,250,.56);
  --linha:rgba(28,18,37,.13);
  --linha-forte:rgba(28,18,37,.24);
  --linha-territorio:rgba(242,239,250,.20);
  /* tokens derivados (só tema claro) */
  --chip-bg:rgba(74,22,168,.09);
  --chip-tx:#4A16A8;
  --chip-neutro-bg:rgba(28,18,37,.07);
  --chip-selo-bg:rgba(110,38,57,.11);
  --chip-erro-bg:rgba(196,16,47,.10);
  --sutil:rgba(28,18,37,.06);
  --aviso-bg:rgba(110,38,57,.08);
  --aviso-borda:rgba(110,38,57,.28);
  --ganho-suave:rgba(215,255,62,.22);
  --ganho-borda:rgba(215,255,62,.55);
  --foco:#4A16A8;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-ui:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --t-nano:11px; --t-micro:12px; --t-mini:13px; --t-base:15px;
  --t-md:17px; --t-lg:21px; --t-xl:27px; --t-2xl:34px; --t-num:46px;
  --tr-display:-.045em; --tr-rotulo:.16em;
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px; --e7:48px;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --alvo:44px;
  --sombra:0 10px 30px rgba(28,18,37,.18);
  /* cores do carrossel editorial (conteúdo, não mudam com o tema) */
  --ed-grafite:#1F1E1D; --ed-offwhite:#F1ECE4; --ed-marsala:#5E0B1A; --ed-creme:#F1E4D8;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--superficie-territorio);color:var(--texto-invertido);
  font:var(--t-base)/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:var(--f-ui)}
:focus-visible{outline:3px solid var(--acao-ganho);outline-offset:2px;border-radius:6px}
main :focus-visible{outline-color:var(--foco)}
.hide{display:none !important}
.num{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);font-variant-numeric:tabular-nums;line-height:.9}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);line-height:1.02;text-transform:lowercase}
.rotulo{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase}

/* botões (vocabulário do app) */
.btn{min-height:var(--alvo);padding:0 var(--e4);border-radius:var(--r-pill);font-weight:700;font-size:var(--t-base);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--e2);text-align:center;transition:transform .08s}
.btn:active{transform:scale(.975)}
.btn-ganho{background:var(--acao-ganho);color:var(--sobre-ganho)}
.btn-fantasma{background:transparent;border:1.5px solid var(--linha-forte);color:var(--texto-forte)}
.btn-fantasma-inv{background:var(--superficie-cartao-territorio);color:var(--texto-invertido);border:1.5px solid var(--linha-territorio)}
.btn-risco{background:transparent;border:1.5px solid var(--aviso-borda);color:var(--alerta-texto)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icb{width:var(--alvo);height:var(--alvo);border-radius:var(--r-sm);display:grid;place-items:center;font-size:var(--t-md);flex:none;
  background:var(--superficie-cartao-territorio);color:var(--texto-invertido)}
.icb-clara{background:var(--sutil);color:var(--texto-forte)}
.campo{width:100%;background:var(--superficie-cartao);color:var(--texto-forte);border:1.5px solid var(--linha);border-radius:var(--r-md);
  padding:var(--e3) var(--e4);min-height:var(--alvo);resize:vertical;outline:none;font-size:var(--t-base);line-height:1.55;font-family:var(--f-ui)}
.campo::placeholder{color:var(--texto-fraco)}
.campo:focus{border-color:var(--foco);box-shadow:0 0 0 3px rgba(74,22,168,.16)}
select.campo{min-height:40px;padding:0 var(--e3);font-size:var(--t-mini);font-weight:600}
.lbl{display:block;font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-medio);margin:var(--e5) 0 var(--e2)}
.dica{font-size:var(--t-micro);color:var(--texto-fraco);margin:var(--e1) 0 var(--e2);line-height:1.45}

/* header território */
header{position:sticky;top:0;z-index:30;background:var(--superficie-territorio);padding:calc(env(safe-area-inset-top) + 14px) var(--e4) 0}
.hrow{display:flex;align-items:center;gap:var(--e3);min-height:var(--alvo)}
.hrow .tt{flex:1;min-width:0}
.hrow .tt .n1{font-size:var(--t-md);font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tt .n2{font-size:var(--t-micro);color:var(--texto-invertido-medio);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca .selo{width:38px;height:38px;border-radius:11px;background:var(--acao-ganho);display:grid;place-items:center;flex:none}
.marca .selo svg{width:26px;height:26px}
.placar{display:flex;gap:var(--e5);padding:var(--e4) 0 var(--e4);align-items:flex-end;flex-wrap:wrap}
.placar .it{display:flex;flex-direction:column;gap:2px;text-align:left;color:inherit}
.placar .v{font-size:var(--t-2xl)}
.placar .v small{font-size:var(--t-md);color:var(--texto-invertido-fraco);letter-spacing:0}
.placar .k{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-invertido-medio);line-height:1.3}
.placar .it.ganho .v{color:var(--acao-ganho)}
.hdia{font-family:var(--f-ui);font-weight:600;font-size:var(--t-md);color:var(--texto-invertido);line-height:1.2;margin-top:var(--e3)}
.hdia i{color:var(--acao-ganho);font-style:normal}

/* área de trabalho */
main{background:var(--superficie-trabalho);color:var(--texto-forte);min-height:calc(100vh - 120px);
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--e5) var(--e4) 140px}
.wrap{max-width:720px;margin:0 auto}
.secao-tit{display:flex;align-items:baseline;gap:var(--e3);margin:var(--e6) 0 var(--e1)}
.secao-tit:first-child{margin-top:0}
.secao-tit h2{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);font-size:var(--t-xl);margin:0;text-transform:lowercase;line-height:1.05}
.secao-tit .qt{font-size:var(--t-lg);color:var(--texto-fraco)}
.secao-sub{color:var(--texto-medio);font-size:var(--t-mini);margin:0 0 var(--e4);max-width:52ch;text-wrap:pretty}

.chip{font-size:var(--t-nano);font-weight:600;padding:4px 9px;border-radius:var(--r-pill);background:var(--chip-bg);color:var(--chip-tx);
  white-space:nowrap;max-width:24ch;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.chip-neutro{background:var(--chip-neutro-bg);color:var(--texto-medio)}
.chip-selo{background:var(--chip-selo-bg);color:var(--selo-valor)}
.chip-erro{background:var(--chip-erro-bg);color:var(--alerta-texto)}
.chip-ganho{background:var(--acao-ganho);color:var(--sobre-ganho);font-weight:700}
.chip-ex{background:transparent;border:1px dashed var(--linha-forte);color:var(--texto-fraco);font-weight:600}
.metas{display:flex;flex-wrap:wrap;gap:var(--e2);align-items:center}

.card{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);padding:var(--e4);margin-bottom:var(--e3);
  color:var(--texto-forte);position:relative}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:var(--t-md);line-height:1.22;text-wrap:pretty}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.abre{display:block;width:100%;text-align:left;color:inherit;padding:0}
.acoes{display:flex;gap:var(--e2);margin-top:var(--e4);align-items:center}
.acoes .btn{flex:1}
.acoes .btn-ganho{flex:1.4}

/* sugestão */
.sug .topo{display:flex;align-items:center;gap:var(--e2);margin-bottom:var(--e3);flex-wrap:wrap}
.sug .ordem{font-family:var(--f-ui);font-weight:700;font-size:var(--t-base);line-height:1;color:var(--selo-valor);width:26px;height:26px;border-radius:50%;background:var(--chip-selo-bg);display:grid;place-items:center;margin-right:2px}
.sug .gancho{font-family:var(--f-ui);font-weight:600;font-size:var(--t-base);line-height:1.35;margin:var(--e2) 0 var(--e3);color:var(--texto-forte);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sug .gancho::before{content:attr(data-rot) " · ";font-family:var(--f-ui);font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);
  text-transform:uppercase;color:var(--texto-fraco);vertical-align:middle}
.porque{font-size:var(--t-mini);color:var(--texto-medio);margin:var(--e3) 0 0;line-height:1.45}
.porque b{color:var(--texto-forte)}
.precisa{margin-top:var(--e3);font-size:var(--t-micro);color:var(--selo-valor);font-weight:600;display:flex;gap:6px;align-items:flex-start}
.decidida{display:flex;gap:var(--e3);align-items:center;font-size:var(--t-mini);color:var(--texto-medio);padding:var(--e3) var(--e4);
  border:1.5px dashed var(--linha-forte);border-radius:var(--r-md);margin-bottom:var(--e2)}
.decidida b{color:var(--texto-forte);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* acompanhamento (stories) */
.trilha{display:flex;gap:var(--e1);margin:var(--e3) 0 var(--e2)}
.trilha span{flex:1;height:6px;border-radius:var(--r-pill);background:var(--sutil)}
.trilha span.feito{background:var(--chip-tx);opacity:.55}
.trilha span.on{background:var(--acao-ganho);opacity:1;box-shadow:0 0 0 1px rgba(28,18,37,.15)}
.trilha-leg{display:flex;justify-content:space-between;font-size:var(--t-nano);color:var(--texto-fraco);font-weight:600}
.prev{font-size:var(--t-mini);color:var(--texto-medio);margin-top:var(--e2)}
.prev b{color:var(--texto-forte)}

/* miniaturas */
.thumbs{display:flex;gap:6px;margin:var(--e3) 0 0}
.thumbs .sl{flex:0 0 64px;border-radius:6px}

/* avisos e destaque */
.maviso{background:var(--aviso-bg);border:1.5px solid var(--aviso-borda);color:var(--texto-forte);border-radius:var(--r-md);
  padding:var(--e4);margin:0 0 var(--e4);font-size:var(--t-mini);line-height:1.5}
.maviso b{color:var(--selo-valor)}
.maviso .btn{margin-top:var(--e3)}
.destaque{background:var(--ganho-suave);border:1.5px solid var(--ganho-borda);border-radius:var(--r-md);padding:var(--e4);margin:var(--e3) 0}
.destaque .t{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--selo-valor);margin-bottom:var(--e1)}

.vazio{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);padding:var(--e6) var(--e5);
  display:flex;flex-direction:column;gap:var(--e3);align-items:flex-start;margin-bottom:var(--e3)}
.vazio .n{font-size:var(--t-2xl);color:var(--acao-ganho);-webkit-text-stroke:1px var(--sobre-ganho)}
.vazio h4{font-family:var(--f-display);font-weight:700;letter-spacing:var(--tr-display);font-size:var(--t-lg);margin:0;text-transform:lowercase}
.vazio p{margin:0;color:var(--texto-medio);font-size:var(--t-mini);max-width:46ch;text-wrap:pretty}
.vazio ul{margin:0;padding-left:1.1em;color:var(--texto-medio);font-size:var(--t-mini)}

/* métricas compactas */
.mini{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);padding:var(--e4);margin-bottom:var(--e3)}
.mini .nums{display:flex;gap:var(--e5);margin:var(--e3) 0;flex-wrap:wrap}
.mini .nums div{display:flex;flex-direction:column;gap:2px}
.mini .nums .v{font-size:var(--t-xl)}
.mini .nums .k{font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-fraco)}
.mini p{margin:0;font-size:var(--t-mini);color:var(--texto-medio);line-height:1.5}
.mini p b{color:var(--texto-forte)}
.linkb{display:inline-flex;align-items:center;gap:6px;margin-top:var(--e3);font-size:var(--t-micro);font-weight:700;color:var(--chip-tx);min-height:36px}

/* atalhos para os módulos (destinos, não abas) */
.atalhos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e2);margin-top:var(--e6)}
.atalho{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-md);padding:var(--e3);text-align:left;
  display:flex;flex-direction:column;gap:2px;min-height:76px;color:var(--texto-forte)}
.atalho .em{font-size:20px;line-height:1}
.atalho .nm{font-weight:700;font-size:var(--t-mini);margin-top:auto;line-height:1.2}
.atalho .hd{font-size:var(--t-nano);color:var(--texto-fraco)}

/* simulador do protótipo */
.simular{margin-top:var(--e7);border:1.5px dashed var(--linha-forte);border-radius:var(--r-md);padding:var(--e3) var(--e4)}
.simular summary{cursor:pointer;font-size:var(--t-micro);font-weight:700;color:var(--texto-fraco);min-height:32px;display:flex;align-items:center}
.filtros{display:flex;gap:var(--e2);flex-wrap:wrap;margin:var(--e2) 0}
.filtro{min-height:36px;padding:0 var(--e3);border-radius:var(--r-pill);font-size:var(--t-micro);font-weight:600;background:var(--sutil);color:var(--texto-medio);border:1.5px solid transparent}
.filtro.on{background:var(--superficie-territorio);color:var(--texto-invertido);font-weight:700}

/* banco */
.bfiltros{display:grid;grid-template-columns:1fr 1fr;gap:var(--e2);margin-bottom:var(--e3)}
.seg{display:flex;background:var(--sutil);border-radius:var(--r-pill);padding:3px;gap:2px;margin-bottom:var(--e4)}
.seg button{flex:1;min-height:36px;border-radius:var(--r-pill);font-size:var(--t-micro);font-weight:700;color:var(--texto-medio)}
.seg button.on{background:var(--superficie-territorio);color:var(--texto-invertido)}
.ideia .lin{display:flex;gap:var(--e3);align-items:flex-start}
.ideia .lin .abre{flex:1;min-width:0}
.ideia .ang{font-size:var(--t-mini);color:var(--texto-medio);margin:var(--e2) 0 0;line-height:1.45}
.ideia .metas{margin-top:var(--e3)}
.ideia.velha{border-style:dashed}
.ideia .lado{display:flex;flex-direction:column;gap:var(--e2);flex:none}
.ideia .lado .btn{min-height:40px;padding:0 var(--e3);font-size:var(--t-mini)}
details.grupo{margin-top:var(--e5)}
details.grupo>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--e3);min-height:var(--alvo);
  font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-medio)}
details.grupo>summary::-webkit-details-marker{display:none}
details.grupo>summary::after{content:"";flex:1;height:1.5px;background:var(--linha)}
details.grupo>summary .seta{transition:transform .15s}
details.grupo[open]>summary .seta{transform:rotate(90deg)}
.semres{padding:var(--e5) 0;color:var(--texto-fraco);font-size:var(--t-mini)}

/* ficha */
.fstatus{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);padding:var(--e3) var(--e4);margin-bottom:var(--e4)}
.fstatus .linha1{display:flex;align-items:center;gap:var(--e2);flex-wrap:wrap;font-size:var(--t-mini);color:var(--texto-medio)}
.ftema{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;font-size:var(--t-xl);line-height:1.08;margin:var(--e3) 0 var(--e2);text-wrap:balance}
.fbloco{background:var(--superficie-cartao);border:1.5px solid var(--linha);border-radius:var(--r-lg);padding:var(--e4);margin-top:var(--e3)}
.fbloco h3{margin:0 0 var(--e2);font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-medio);
  display:flex;align-items:center;gap:var(--e2)}
.fbloco h3 .chip{letter-spacing:0;text-transform:none}
.fbloco ol,.fbloco ul{margin:0;padding-left:1.3em;font-size:var(--t-mini);line-height:1.5}
.fbloco li{margin-bottom:6px}
.fbloco p{margin:0;font-size:var(--t-mini);line-height:1.55;color:var(--texto-medio)}
.gancho-g{font-family:var(--f-ui);font-weight:700;font-size:var(--t-lg);line-height:1.25;letter-spacing:-.01em;color:var(--texto-forte);margin:0}
.txtlongo{white-space:pre-wrap;font-size:var(--t-mini);line-height:1.55;color:var(--texto-forte);max-height:220px;overflow:auto;
  background:var(--sutil);border-radius:var(--r-sm);padding:var(--e3);margin:0;font-family:var(--f-ui);user-select:text;-webkit-user-select:text}
.txtlongo.aberto{max-height:none}
.blocohead{display:flex;align-items:center;justify-content:space-between;gap:var(--e2);margin-bottom:var(--e2)}
.blocohead h3{margin:0}
.btn-mini{min-height:36px;padding:0 var(--e3);font-size:var(--t-micro);border-radius:var(--r-pill);font-weight:700;
  background:var(--sutil);color:var(--texto-forte);display:inline-flex;align-items:center;gap:6px}
.ajuste{background:var(--superficie-cartao);border:1.5px solid var(--foco);border-radius:var(--r-lg);padding:var(--e4);margin-top:var(--e3)}
.ajuste .rapidos{display:flex;gap:var(--e2);flex-wrap:wrap;margin:var(--e2) 0 var(--e3)}
.ajuste .acoes{margin-top:var(--e3)}
.coment{font-size:var(--t-mini);color:var(--texto-medio);border-left:3px solid var(--selo-valor);padding:2px 0 2px var(--e3);margin-top:var(--e2)}
.semdesc{font-size:var(--t-micro);color:var(--texto-fraco);margin-top:var(--e3)}

/* barra fixa de ação */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--superficie-trabalho);border-top:1.5px solid var(--linha);
  padding:var(--e3) var(--e4) calc(env(safe-area-inset-bottom) + 12px)}
.barra .in{max-width:720px;margin:0 auto;display:flex;gap:var(--e2)}
.barra .btn{flex:1;min-height:52px;font-size:var(--t-md)}
.barra .btn-ganho{flex:1.5}
.barra .icb{width:52px;height:52px}

/* tira de slides (carrossel editorial desenhado em CSS) */
.tira{display:flex;gap:var(--e3);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--e2) 0 var(--e3);
  margin:0 calc(var(--e4) * -1);padding-left:var(--e4);padding-right:var(--e4);scroll-padding-left:var(--e4);scrollbar-width:none}

/* Produção da Pauta: rotina de hora em hora, todos os dias, 07h–20h BRT; leva ~30 min */
function previsao(base){
  const d=new Date(base||S.agora);
  const slot=new Date(d); slot.setMinutes(0,0,0); slot.setHours(slot.getHours()+1);
  if(slot.getHours()<7) slot.setHours(7);
  if(slot.getHours()>20){ slot.setDate(slot.getDate()+1); slot.setHours(7) }
  const pronto=new Date(slot.getTime()+30*60000);
  const a=isoDe(S.agora), b=isoDe(pronto);
  const quando=b===a?"hoje":b===addDias(a,1)?"amanhã":DIAS[pronto.getDay()];
  return {rodada:hh(slot),pronto:hh(pronto),quando,txt:quando==="hoje"?"até ~"+hh(pronto):quando+" ~"+hh(pronto)};
}

let tT;
function toast(msg,desfazer,err){
  const t=$("#toast"),b=$("#toastBtn");
  $("#toastTx").textContent=msg; t.classList.toggle("err",!!err);
  if(desfazer){ b.classList.remove("hide"); t.classList.remove("sem-btn"); b.onclick=()=>{ desfazer(); t.classList.remove("on"); clearTimeout(tT) } }
  else { b.classList.add("hide"); t.classList.add("sem-btn") }
  t.classList.add("on"); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("on"),desfazer?5000:2600);
}

function mudar(id,status,extra,msg){

}

  const p=get(id); const alvo=S.alvo; const dia=alvo?alvo.dia:hojeISO();

  const hora=p.horario_pref||sugHora(dia,p.formato);
  S.alvo=null; if(alvo) S.filtro.f="";
  mudar(id,"aprovada_producao",{data:dia,agendado_para:atHM(dia,hora),aprovado_producao_em:new Date(S.agora),decidido_em:new Date(S.agora),comentario:ajuste||"",comentario_em:ajuste?new Date(S.agora):undefined},
    (ja?`Na fila (${ja+1} em produção). `:"Na fila. ")+(p.formato==="reels"?"Roteiro pronto ":"Pronto ")+pv.txt+(dia!==hojeISO()?` · agendado ${diaTxt(dia)} ${hora}`:""));

}

function setHora(id,h){ const p=get(id); S.hora=false; const ex={horario_editado:true};
  if(p.agendado_para){ const [H,M]=h.split(":").map(Number); const d=new Date(p.agendado_para); d.setHours(H,M,0,0); ex.agendado_para=d } else ex.horario_pref=h;
  mudar(id,p.status,ex,"Agendado para "+diaTxt(diaDe(p))+" "+h) }

function copiar(txt,preId){
  const ok=()=>toast("Copiado");
  const falha=()=>{ const el=document.getElementById(preId);
    if(el){ const dt=el.closest("details"); if(dt) dt.open=true; el.classList.add("aberto"); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r) }
    toast("Não deu para copiar sozinho. Texto selecionado: toque em Copiar",null,true) };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(falha); else falha() }catch(e){ falha() }
}

/* prévia de uma pauta produzida: miniaturas (estático) ou o gancho falado + nº de cenas (Reels) */

/* ===================== TELA HOJE ===================== */
function faixaSug(f,sugs,fila){
  const todas=sugs.filter(p=>p.formato===f), pend=todas.filter(p=>p.status==="sugerida"), feitas=todas.filter(p=>p.status!=="sugerida");
  if(!todas.length) return "";
  const fm=FORM[f]; let h=`<div class="secao-tit"><h2>${f==="estatico"?"estático de hoje":"reels de hoje"}</h2><span class="qt num">${pend.length?pend.length+"/"+todas.length:"✓"}</span></div>`;
  if(pend.length){
    h+=`<p class="secao-sub">${f==="estatico"?"3 ideias de carrossel.":"3 ideias de Reels, com gancho falado e cenas curtas."} Escolha 1 ou mais; o resto vai para o banco ou para a lixeira.${S.agora.getHours()<10?" Escolhendo até 10h, fica pronto para postar hoje.":""}</p>`;
    h+=`<div class="rail" id="rail-${f}" tabindex="0" aria-label="Sugestões de ${fm.nome}, deslize para o lado">${pend.map(p=>sugCard(p,todas.indexOf(p))).join("")}</div>
        <div class="rail-pontos" id="pt-${f}" aria-hidden="true">${pend.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`;
  } else h+=`<p class="secao-sub">Escolha feita. Toque para abrir.</p>`;
  if(feitas.length) h+=feitas.map(p=>`<button class="decidida abre" data-abrir="${p.id}" style="display:flex"><span class="chip ${p.status==="descartado"?"chip-neutro":p.status==="ideia"?"chip-selo":""}">${esc(STATUS_TX[p.status])}</span><b>${esc(p.tema)}</b><span>›</span></button>`).join("");
  return h;
}
function renderHoje(){
  hdHoje(); $("#barra").innerHTML="";
  const P=S.pautas.filter(p=>!p.legado&&!p.hist);
  const postar=P.filter(p=>p.status==="aprovado");
  const revisar=P.filter(p=>p.status==="para_revisar");
  const ajustando=P.filter(p=>p.status==="ajustar");
  const sugs=P.filter(p=>p.sug&&p.data===hojeISO());
  const pend=sugs.filter(p=>p.status==="sugerida");
  const fila=P.filter(p=>["aprovada_producao","em_producao"].includes(p.status));
  const banco=doBanco().length;
  let h="";

  /* 1. bloqueio: rotina falhou */
  if(S.rotina==="falhou") h+=`<div class="maviso" role="status"><b>As sugestões de hoje não chegaram.</b><br>
     A rotina das 05:47 não terminou. Não é nada com você: já ficou registrado e ela tenta de novo amanhã.
     Quer postar algo hoje? Escolha uma do banco, de estático ou de Reels.<br>
     <button class="btn btn-ganho" data-ir="#banco">Abrir banco de ideias (${banco})</button></div>`;

  /* 2. postar (mais perto de contar no dia) */
  if(postar.length){ h+=`<div class="secao-tit"><h2>falta postar</h2><span class="qt num">${postar.length}</span></div>
    <p class="secao-sub">Aprovado. Copie a legenda, poste no Instagram. Se o app não detectar sozinho, marque aqui.</p>`;
    postar.forEach(p=>{ h+=`<article class="card"><button class="abre" data-abrir="${p.id}"><div class="metas" style="margin-bottom:var(--e2)">${chipF(p.formato)}<span class="chip chip-neutro">${diaTxt(diaDe(p))} ${getHora(p)}</span>${ex(p)}</div><h3>${esc(p.tema)}</h3>${previaHTML(p)}</button>
      <div class="acoes"><button class="btn btn-fantasma" data-copiar="${p.id}">Copiar legenda</button><button class="btn btn-ganho" data-postado="${p.id}">Marquei como postado</button></div></article>` }) }

  /* 3. revisar */
  if(revisar.length){ h+=`<div class="secao-tit"><h2>pronto para revisar</h2><span class="qt num">${revisar.length}</span></div>
    <p class="secao-sub">O que você escolheu chegou. Revise até as 10h para postar hoje.</p>`;
    revisar.forEach(p=>{ h+=`<article class="card"><button class="abre" data-abrir="${p.id}"><div class="metas" style="margin-bottom:var(--e2)">${chipF(p.formato)}<span class="chip chip-neutro">${p.formato==="reels"?p.cenas.length+" cenas":(p.deck?DECK.slides.length+" slides":"sem slides no protótipo")}</span><span class="chip chip-neutro">${diaTxt(diaDe(p))} ${getHora(p)}</span>${ex(p)}</div><h3>${esc(p.tema)}</h3>${previaHTML(p)}
      <p class="porque">Chegou às ${hh(p.produzido_em)}${p.formato==="reels"?" · roteiro + legenda, você grava":" · conferência automática: 0 erro"}</p></button>
      <div class="acoes"><button class="btn btn-ganho" data-abrir="${p.id}">Revisar →</button></div></article>` }) }

  /* 4. escolher: duas faixas (estático e Reels) */
  if(sugs.length){ h+=faixaSug("estatico",sugs,fila)+faixaSug("reels",sugs,fila) }

  /* 5. acompanhar: em produção / ajuste */
  if(fila.length||ajustando.length){ h+=`<div class="secao-tit"><h2>em produção</h2><span class="qt num">${fila.length+ajustando.length}</span></div>
    <p class="secao-sub">Não precisa fazer nada. Avisamos no celular quando chegar.</p>`;
    [...fila,...ajustando].forEach(p=>{ const pv=previsao(p.status==="em_producao"?new Date(S.agora.getTime()-3600000):S.agora);
      h+=`<article class="card"><button class="abre" data-abrir="${p.id}"><div class="metas" style="margin-bottom:var(--e2)">${chipF(p.formato)}<span class="chip chip-neutro">${diaTxt(diaDe(p))} ${getHora(p)}</span>${ex(p)}</div><h3>${esc(p.tema)}</h3>${trilhaHTML(p.status)}
       <p class="prev">${p.status==="em_producao"?`A rotina das ${pv.rodada} está montando. <b>Pronto ${pv.txt}</b>`:p.status==="ajustar"?`Refazendo com o seu comentário. <b>Volta ${pv.txt}</b>`:`Na fila da rodada das ${pv.rodada}. <b>Pronto ${pv.txt}</b>`}</p>
       ${p.comentario?`<div class="coment">“${esc(p.comentario)}”</div>`:""}</button>
       ${p.deck||p.formato==="reels"?`<button class="linkb" data-entregar="${p.id}">⟳ protótipo: simular entrega da rotina</button>`:`<p class="semdesc">No protótipo só a sugestão de estático 1 tem slides. Use “simular estado” lá embaixo.</p>`}</article>` }) }

  /* 6. tudo feito */
  if(!postar.length&&!revisar.length&&!pend.length&&!fila.length&&!ajustando.length&&S.rotina!=="falhou"){
    const e=postadoHoje("estatico"), r=postadoHoje("reels"), n=(e?1:0)+(r?1:0);
    h+=`<div class="vazio" style="margin-top:var(--e2)"><span class="n num">✓</span><h4>nada esperando você</h4>
      <p>${n===2?"Estático e Reels de hoje estão postados: o ideal do dia foi cumprido. ":n===1?`O ${e?"estático":"Reels"} de hoje está postado: o mínimo do dia foi cumprido. Falta o ${e?"Reels":"estático"} para o ideal (1 estático + 1 Reels). `:""}Amanhã às 05:47 chegam 3 sugestões de estático e 3 de Reels, já pensadas a partir das métricas de hoje.</p>
      <ul><li>${banco} ideias guardadas no banco</li><li>${diasComPost()} de 7 dias com post nesta semana</li></ul>
      <button class="btn btn-fantasma" data-ir="#banco">Ver banco de ideias</button></div>`;
  }

  /* 7. sinal das métricas (informativo) */
  h+=`<div class="secao-tit"><h2>ontem no instagram</h2></div>
    <div class="mini"><div class="metas"><span class="chip chip-ex">exemplo</span><span class="chip chip-neutro">análise das 05:23</span></div>
     <div class="nums"><div><span class="v num">2.696</span><span class="k">alcance</span></div><div><span class="v num">32</span><span class="k">salvos</span></div><div><span class="v num">59</span><span class="k">compart.</span></div></div>
     <p><b>Sinal para a pauta:</b> Reels de identificação puxam compartilhamento. Carrossel ainda salva pouco: prefira tutorial com prompt pronto e CTA de salvar.</p>
     <button class="linkb" data-ir="#metricas">Ver métricas →</button></div>`;

  /* 8. destinos */
  h+=`<div class="atalhos">
     <button class="atalho" data-ir="#calendario"><span class="em">📅</span><span class="nm">Calendário</span><span class="hd">${diasComPost()} de 7 dias com post</span></button>
     <button class="atalho" data-ir="#banco"><span class="em">🗂️</span><span class="nm">Banco de ideias</span><span class="hd">${banco} guardadas</span></button>
     <button class="atalho" data-ir="#metricas"><span class="em">📊</span><span class="nm">Métricas</span><span class="hd">Instagram</span></button>
     <button class="atalho" data-ir="#canais"><span class="em">📁</span><span class="nm">Canais</span><span class="hd">referências e funil</span></button></div>
     <div class="rodape-lix"><button class="linkb" data-ir="#lixeira">Lixeira (${naLixeira().length}) →</button></div>`;

  /* simulador */
  h+=`<details class="simular" ${S._simAberto?"open":""}><summary>⚙ protótipo · simular estado</summary>
    <div class="filtros" role="group" aria-label="Simular estado">${ESTADOS.map(([k,n])=>`<button class="filtro ${S.estado===k?"on":""}" data-estado="${k}">${n}</button>`).join("")}</div>
    <p class="dica">Os botões mexem só neste protótipo. Nada é gravado.</p></details>`;

  $("#view").innerHTML=`<div class="wrap">${h}</div>`;
  ligarRails();
}
function ligarRails(){
  ["estatico","reels"].forEach(f=>{ const r=document.getElementById("rail-"+f); if(!r) return;
    r.onscroll=()=>{ const c=r.querySelector(".card"); if(!c) return; const w=c.getBoundingClientRect().width+12; const i=Math.min(r.children.length-1,Math.round(r.scrollLeft/w));
      document.querySelectorAll("#pt-"+f+" i").forEach((e,k)=>e.classList.toggle("on",k===i)) } });
}

/* ===================== BANCO DE IDEIAS ===================== */
function renderBanco(){
  const todas=doBanco(); const F=S.filtro; const A=S.alvo;
  if(A) F.f=A.formato;
  hdSub("Banco de ideias",A?`escolhendo para ${diaTxt(A.dia)} · ${FORM[A.formato].nome}`:`${todas.length} guardadas · produzir a qualquer dia`,A?"#calendario":"#hoje"); $("#barra").innerHTML="";

/* ===================== CALENDÁRIO ===================== */
const PRI=["postado","aprovado","para_revisar","ajustar","em_producao","aprovada_producao"];
const ESTV={postado:"postado",aprovado:"aprovado",para_revisar:"para revisar",ajustar:"em produção",em_producao:"em produção",aprovada_producao:"em produção"};
const ESTCLS={postado:"postado",aprovado:"aprovado","para revisar":"revisar","em produção":"producao",sugerida:"sugerida",vazio:"vazio"};
function vaga(dia,f){
  const c=S.pautas.filter(p=>p.data===dia&&p.formato===f&&PRI.includes(p.status)&&!p.legado).sort((a,b)=>PRI.indexOf(a.status)-PRI.indexOf(b.status));
  if(c.length) return {p:c[0],n:c.length,estado:ESTV[c[0].status]};
  const pend=S.pautas.filter(p=>p.sug&&p.data===dia&&p.formato===f&&p.status==="sugerida").length;
  if(pend) return {estado:"sugerida",pend};
  return {estado:"vazio"};
}
function vagaHTML(dia,f){
  const v=vaga(dia,f), fm=FORM[f], futuro=dia>=hojeISO();
  const chipCls={postado:"chip-ganho","para revisar":"chip-selo",vazio:"chip-neutro",sugerida:"chip-selo"}[v.estado]||"";
  let tema, hora, ig="", dentro="", abre="", div=false;
  if(v.p){ const p=v.p; tema=esc(p.tema);
    hora=p.status==="postado"?`postado ${hh(p.postado_em)}`:`${p.horario_editado?"agendado":"sugerido"} ${getHora(p)}`;
    abre=`data-abrir="${p.id}"`;
    if(p.status==="postado") ig=`<a class="linkb" href="https://www.instagram.com/" target="_blank" rel="noopener" title="Link de exemplo">ver no Instagram ↗</a>`;
  } else if(v.estado==="sugerida"){ tema=`${v.pend} sugestões para escolher`; hora=`sugerido ${sugHora(dia,f)}`; abre=`data-ir="#hoje"`; dentro=`<span class="semlink">ver no Hoje →</span>`; }
  else if(futuro){ tema="Vaga livre"; hora=`sugerido ${sugHora(dia,f)}`; abre=`data-escolher="${dia}|${f}"`; dentro=`<span class="semlink">escolher do banco →</span>`; }
  else { tema="Sem post"; hora="sem registro"; div=true }
  const corpo=`<span class="vf">${fm.ic} ${fm.nome}</span><span class="chip ${chipCls}">${v.estado}${v.n>1?" +"+(v.n-1):""}</span><span class="vtema clamp2">${tema}</span><span class="vhora">${hora}</span>${dentro}`;
  const rot=`${fm.nome} em ${diaTxt(dia)}: ${v.estado}. ${v.p?v.p.tema:""}${dentro?" "+dentro.replace(/<[^>]+>/g,""):""}`;
  return `<div class="vaga v-${ESTCLS[v.estado]}">${div?`<div class="vaga-b">${corpo}</div>`:`<button class="abre vaga-b" ${abre} aria-label="${esc(rot)}">${corpo}</button>`}${ig}</div>`;
}

      ${[0,1,2,3,4,5,6].map(i=>{ const d=addDias(ini,i), dd=parse(d); return `<section class="cdia ${d===hoje?"hoje":""}"><h3>${DIAS[dd.getDay()]} ${dd.getDate()}${d===hoje?` <span class="chip">hoje</span>`:""}</h3><div class="vagas">${vagaHTML(d,"estatico")}${vagaHTML(d,"reels")}</div></section>` }).join("")}`;

    if(p.status==="ajustar") h+=`<div class="maviso"><b>Ajuste pedido.</b> A rotina refaz e avisa quando voltar.<div class="coment">“${esc(p.comentario)}”</div></div>`;
    if(S.ajuste&&p.status==="para_revisar") h+=`<div class="ajuste" id="ajBox"><label class="lbl" for="ajTx" style="margin-top:0">O que mudar?</label>
       <div class="rapidos">${(reels?["Troca o gancho falado","Cenas mais curtas","Mais curto","Tom mais leve"]:["Troca o gancho da capa","Outra foto na capa","Mais curto","Tom mais leve"]).map(t=>`<button class="filtro" data-rapido="${esc(t)}">${t}</button>`).join("")}</div>
       <textarea class="campo" id="ajTx" rows="3" placeholder="${reels?"Ex.: a cena 3 está longa; corta a explicação":"Ex.: slide 5 está longo; corta a parte do Karpathy"}"></textarea>
       <p class="dica">A rotina lê isto e refaz só o que você pediu.</p>
       <div class="acoes"><button class="btn btn-fantasma" id="ajCancela">Cancelar</button><button class="btn btn-ganho" id="ajEnvia" disabled>Enviar ajuste</button></div></div>`;
    if(p.legenda) h+=`<div class="fbloco"><div class="blocohead"><h3>Legenda</h3><button class="btn-mini" data-copiar="${p.id}">⧉ Copiar legenda</button></div>
        <pre class="txtlongo" id="legTx">${esc(p.legenda)}</pre></div>`;
    if(p.status!=="postado") h+=horaBlock(p);
    if(p.status==="aprovado") h+=`<div class="destaque"><div class="t">Postado é automático</div><p style="margin:0;font-size:var(--t-mini);line-height:1.45">Quando o post aparecer no Instagram (coleta a cada 4 h, próxima ~${proxColeta()}), esta pauta vira “postado” sozinha. Se você já postou e ainda não apareceu, use “Marquei como postado”.</p>
        <button class="linkb" data-coleta="${p.id}">⟳ protótipo: simular a coleta do Instagram</button></div>`;
    if(p.gancho||p.fontes) h+=`<details class="fbloco"><summary style="cursor:pointer;font-size:var(--t-nano);font-weight:700;letter-spacing:var(--tr-rotulo);text-transform:uppercase;color:var(--texto-medio);min-height:28px">Proposta original e fontes</summary>
        ${p.gancho?`<p style="margin-top:var(--e2)"><b>${reels?"Gancho falado":"Gancho"}:</b> ${esc(p.gancho)}</p>`:""}${p.fontes?`<p style="margin-top:var(--e2)"><b>Fontes:</b> ${esc(p.fontes)}</p>`:""}${p.comentario_prev?`<div class="coment">Seu pedido antes de produzir: “${esc(p.comentario_prev)}”</div>`:""}</details>`;
    if(["para_revisar","aprovado"].includes(p.status)) h+=`<div style="margin-top:var(--e6)"><button class="btn btn-risco" data-lixeira="${p.id}" style="width:100%">Não vou postar este</button></div>`;
    if(p.status==="para_revisar"&&!S.ajuste) barra=`<button class="btn btn-fantasma" id="bAjustar">Ajustar</button><button class="btn btn-ganho" data-aprovar="${p.id}">Aprovar</button>`;
    if(p.status==="aprovado") barra=`<button class="btn btn-fantasma" data-copiar="${p.id}">Copiar legenda</button><button class="btn btn-ganho" data-postado="${p.id}" style="font-size:var(--t-base)">Marquei como postado</button>`;
  } else {
    if(["aprovada_producao","em_producao"].includes(p.status)){ const pv=previsao();
      h+=`<div class="fstatus"><div class="linha1"><span class="chip">${esc(STATUS_TX[p.status])}</span><span>${reels?"roteiro":"pronto"} ${pv.txt}</span></div>${trilhaHTML(p.status)}</div>` }
    h+=`${tags}<div class="ftema">${esc(p.tema)}</div>`;
    if(p.gancho) h+=`<div class="fbloco"><h3>${reels?"Gancho falado":"Gancho da capa"}</h3><p class="gancho-g">“${esc(p.gancho)}”</p></div>`;
    if(p.angulo) h+=`<div class="fbloco"><h3>Ângulo</h3><p>${esc(p.angulo)}</p>${!p.roteiro&&!p.cenas?`<p class="dica" style="margin-top:var(--e2)">Ideia guardada sem roteiro: a produção monta ${reels?"gancho falado e cenas":"gancho e slides"} a partir do ângulo.</p>`:""}</div>`;
    if(p.roteiro) h+=`<div class="fbloco"><h3>O que cada slide diz <span class="chip chip-neutro">${p.roteiro.length} slides</span></h3><ol>${p.roteiro.map(r=>`<li>${esc(r)}</li>`).join("")}</ol></div>`;
    if(p.cenas) h+=`<div class="fbloco"><h3>Cenas <span class="chip chip-neutro">${p.cenas.length} cenas · ${esc(p.dur)}</span></h3>${cenasHTML(p)}</div>`;
    if(p.porque) h+=`<div class="fbloco"><h3>Por quê</h3><ul>${p.porque.map(([k,v])=>`<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join("")}</ul></div>`;
    if(p.fontes) h+=`<div class="fbloco"><h3>Fontes</h3><p>${esc(p.fontes)}</p></div>`;
    if(p.confirmar) h+=`<div class="maviso" style="margin-top:var(--e3)"><b>Precisa de você:</b> ${esc(p.confirmar)}</div>`;
    if(p.valida_ate) h+=`<div class="maviso"><b>Prazo:</b> só faz sentido até ${ddmm(p.valida_ate)}.</div>`;
    if(p.status!=="descartado") h+=horaBlock(p);
    if(["sugerida","ideia"].includes(p.status)){
      h+=`<label class="lbl" for="ajPre">Ajuste antes de produzir <span style="text-transform:none;letter-spacing:0;font-weight:500">(opcional)</span></label>
        <textarea class="campo" id="ajPre" rows="2" placeholder="Ex.: troca o exemplo por um de RH">${esc(p._rascunho||"")}</textarea>
        <p class="dica">A rotina lê isto antes de montar. Deixe em branco para produzir como está.</p>`;
      barra=`<button class="btn btn-fantasma" data-lixeira="${p.id}">Lixeira</button>
        ${p.status==="sugerida"?`<button class="btn btn-fantasma" data-banco="${p.id}">Banco</button>`:""}
        <button class="btn btn-ganho" id="bProduzir">Produzir</button>`;
    }
    if(p.status==="aprovada_producao") barra=`<button class="btn btn-fantasma" data-banco="${p.id}">Voltar para o banco</button>`;
    if(p.status==="descartado") barra=`<button class="btn btn-ganho" data-restaurar="${p.id}">Restaurar para o banco</button>`;
  }
  $("#view").innerHTML=`<div class="wrap">${h}</div>`;
  $("#barra").innerHTML=barra?`<div class="barra"><div class="in">${barra}</div></div>`:"";
  const tira=$("#tira");
  if(tira) tira.onscroll=()=>{ const sl=tira.querySelector(".sl"); const w=sl.getBoundingClientRect().width+12; const i=Math.min(DECK.slides.length-1,Math.round(tira.scrollLeft/w));
    $("#tiraN").textContent=`${i+1} de ${DECK.slides.length}${i?"":" · deslize"}`; $("#pontos").querySelectorAll("i").forEach((e,k)=>e.classList.toggle("on",k===i)) };
  const bp=$("#bProduzir"); if(bp) bp.onclick=()=>{ const t=($("#ajPre")||{}).value||""; produzir(p.id,t.trim()) };
  const ap=$("#ajPre"); if(ap) ap.oninput=e=>{ p._rascunho=e.target.value };
  const ba=$("#bAjustar"); if(ba) ba.onclick=()=>{ S.ajuste=true; renderFicha(id); setTimeout(()=>{ const t=$("#ajTx"); if(t){ t.focus(); t.scrollIntoView({block:"center"}) } },30) };
  const tx=$("#ajTx");
  if(tx){ const env=$("#ajEnvia"); tx.oninput=()=>env.disabled=!tx.value.trim();
    document.querySelectorAll("[data-rapido]").forEach(b=>b.onclick=()=>{ tx.value=(tx.value.trim()?tx.value.trim()+". ":"")+b.dataset.rapido; env.disabled=false; tx.focus() });
    $("#ajCancela").onclick=()=>{ S.ajuste=false; renderFicha(id) };
    env.onclick=()=>pedirAjuste(id,tx.value.trim()) }
}

/* destinos fora do protótipo */
function renderFora(nome){
  hdSub(nome==="#metricas"?"Métricas":"Canais",nome==="#metricas"?"já existe no app (#/metricas)":"diretório atual, vai para #/canais","#hoje"); $("#barra").innerHTML="";
  $("#view").innerHTML=`<div class="wrap"><div class="vazio"><h4>${nome==="#metricas"?"métricas":"canais"}</h4>
   <p>${nome==="#metricas"?"No app, este atalho abre a tela de Métricas que já existe. Volta para o Hoje pelo ←.":"No app, o diretório de canais (Ideias de referência e Produção) sai da home e passa a morar em #/canais, igual a hoje."}</p>
   <button class="btn btn-fantasma" data-ir="#hoje">Voltar para o Hoje</button></div></div>`;
}

/* ===================== ROTEAMENTO ===================== */
function render(){
  const h=location.hash||"#hoje";
  if(h==="#banco") renderBanco();
  else if(h==="#lixeira") renderLixeira();
  else if(h==="#calendario") renderCalendario();
  else if(h.startsWith("#pauta-")) renderFicha(h.slice(7));
  else if(h==="#metricas"||h==="#canais") renderFora(h);
  else renderHoje();
}
let ultimaRota="";
window.addEventListener("hashchange",()=>{ S.ajuste=false; S.hora=false;
  if(!(location.hash==="#banco"||location.hash.startsWith("#pauta-"))&&S.alvo){ S.alvo=null; S.filtro.f="" }
  render(); if(location.hash!==ultimaRota) window.scrollTo(0,0); ultimaRota=location.hash });

function sairDaFicha(){ if(location.hash.startsWith("#pauta-")) location.hash=["#hoje","#banco","#calendario","#lixeira"].includes(S.de)?S.de:"#hoje" }
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-abrir]"); if(!t) return;
  const d=t.dataset;
  if(d.produzir){ e.stopPropagation(); produzir(d.produzir); return }
  if(d.banco){ paraBanco(d.banco); sairDaFicha(); return }
  if(d.lixeira){ paraLixeira(d.lixeira); sairDaFicha(); return }
  if(d.restaurar){ const noFicha=location.hash.startsWith("#pauta-"); restaurar(d.restaurar); if(noFicha) location.hash="#banco"; return }
  if(d.aprovar){ aprovar(d.aprovar); return }
  if(d.postado){ postado(d.postado,"manual"); return }
  if(d.coleta){ postado(d.coleta,"auto"); return }
  if(d.copiar){ const p=get(d.copiar); copiar(p.legenda||"","legTx"); return }
  if(d.copiarReels){ copiar(reelsTxt(get(d.copiarReels)),"reelsTx"); return }
  if(d.entregar){ simularEntrega(d.entregar); return }
  if(d.mudarHora){ S.hora=!S.hora; renderFicha(location.hash.slice(7)); return }
  if(d.hora){ setHora(location.hash.slice(7),d.hora); return }
  if(d.salvarHora){ const v=($("#horaIn")||{}).value; if(v) setHora(location.hash.slice(7),v); return }
  if(d.escolher){ const [dia,f]=d.escolher.split("|"); S.alvo={dia,formato:f}; S.filtro.f=f; location.hash="#banco"; return }
  if(d.vista){ S.cal.vista=d.vista; renderCalendario(); return }
  if(d.nav){ const n=Number(d.nav), C=S.cal;
    if(C.vista==="semana") C.ini=addDias(C.ini,7*n);
    else { const [y,m]=C.mes.split("-").map(Number); const x=new Date(y,m-1+n,1); C.mes=x.getFullYear()+"-"+pad(x.getMonth()+1) }
    renderCalendario(); return }
  if(d.dia){ S.cal.sel=d.dia; renderCalendario(); return }
  if(d.hojeCal){ S.cal=null; renderCalendario(); return }
  if(d.fonte){ S.fonteHor=d.fonte; renderCalendario(); return }
  if(d.ffmt!==undefined){ S.filtro.f=d.ffmt; renderBanco(); return }
  if(d.abrir){ S.de=location.hash||"#hoje"; location.hash="#pauta-"+d.abrir; return }
  if(d.ir){ location.hash=d.ir; return }
  if(d.estado){ S._simAberto=true; montar(d.estado); S.velho=0; render(); toast("Estado: "+ESTADOS.find(x=>x[0]===d.estado)[1]); return }
  if(d.velho!==undefined){ S.velho=Number(d.velho); renderBanco(); return }
  if(d.ordem){ S.filtro.ordem=d.ordem; renderBanco(); return }
});

montar("manha");
if(!location.hash) history.replaceState(null,"","#hoje");
ultimaRota=location.hash;
render();
</script>
